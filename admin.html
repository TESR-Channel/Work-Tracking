<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0b0a">
<meta name="robots" content="noindex">
<title>TESR Time Clock Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div id="app"><div class="loading">กำลังโหลด…</div></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="assets/config.js"></script>
<script src="assets/core.js"></script>
<script src="assets/mock.js"></script>
<script src="assets/app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function () {
var SUPA = window.TESR_BACKEND === 'supabase'; // ฐานข้อมูล Supabase (ไม่ใช่ Google Sheet)
var A = APP, esc = A.esc, TOKEN = 'tesr-tc-admin';
var api = A.makeApi(TOKEN, function () { logout('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่'); });
var root = document.getElementById('app');
var INFO = null, page = 'today', pendingN = 0;
var st = { onlyAlerts: false, month: null, calMonth: null, reqFilter: 'pending', reqKind: 'all', selEmp: null, editDay: null, showInactive: false, holYear: null };
try { var h = location.hash.replace('#', ''); if (/^(today|req|cal|report|emps|hol|set)$/.test(h)) page = h; } catch (e) {}

/* ================= login ================= */
function showLogin(msg) {
  root.innerHTML = '<div class="login-wrap"><form class="login-card" id="lf">' +
    '<div class="login-brand"><span class="logo lg" role="img" aria-label="TESR"></span><div><b>Time Clock Admin</b><small>สำหรับผู้ดูแลระบบเท่านั้น</small></div></div>' +
    '<div class="field"><label for="u">อีเมล / ชื่อผู้ใช้แอดมิน</label><input id="u" autocomplete="username" autocapitalize="none" required></div>' +
    '<div class="field"><label for="p">รหัสผ่าน</label><input id="p" type="password" autocomplete="current-password" required></div>' +
    '<div id="lerr"></div><button class="btn primary block" type="submit">เข้าสู่ระบบแอดมิน</button>' +
    (A.REMOTE ? '' : '<div class="demo-hint">โหมดทดลอง · <code>admin</code> / <code>tesr1234</code><br>พนักงานทดลอง · <code>somchai@example.com</code> / <code>0800000001</code></div>') +
    '<a href="index.html" class="small" style="text-align:center">ไปหน้าลงเวลาสำหรับพนักงาน</a></form></div>';
  if (msg) document.getElementById('lerr').innerHTML = '<div class="err">' + esc(msg) + '</div>';
  document.getElementById('lf').onsubmit = function (ev) {
    ev.preventDefault();
    var b = ev.target.querySelector('button'); b.disabled = true;
    api('login', { as: 'admin', username: document.getElementById('u').value, password: document.getElementById('p').value })
      .then(function (r) { A.store.set(TOKEN, r.token); start(); })
      .catch(function (e) { document.getElementById('lerr').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; b.disabled = false; });
  };
}
function logout(msg) { A.store.set(TOKEN, null); A.cacheClear(); INFO = null; showLogin(msg); }
/* ได้ข้อมูลใหม่จากเซิร์ฟเวอร์ (โหลดเบื้องหลัง) → วาดหน้าปัจจุบันใหม่ */
A.onFresh(function () {
  if (!INFO || !document.getElementById('main') || !A.idle()) return;
  api('settings').then(function (d) { INFO = d; go(page, true); }).catch(function () {});
});

/* ================= shell ================= */
var NAV = [['today', 'ภาพรวมวันนี้', 'gauge'], ['req', 'คำขออนุมัติ', 'inbox'], ['cal', 'ปฏิทินทีม', 'cal'], ['report', 'รายงานรายเดือน', 'chart'], ['emps', 'พนักงาน', 'people'], ['hol', 'วันหยุดบริษัท', 'star'], ['set', 'ตั้งค่า & QR Code', 'gear']];
function start() {
  if (!A.store.get(TOKEN)) return showLogin();
  api('settings').then(function (d) {
    INFO = d; var t = new Date();
    st.month = st.month || A.ymd(t).slice(0, 7); st.calMonth = st.calMonth || st.month; st.holYear = st.holYear || t.getFullYear();
    shell(); go(page);
  }).catch(function (e) { if (e.code !== 'AUTH') showLogin(e.message); });
}
function shell() {
  root.innerHTML = '<div class="adm"><aside class="side"><div class="brand"><span class="logo" role="img" aria-label="TESR"></span><div><b>Time Clock</b><small>Admin console</small></div><button class="mlo" id="lo2" type="button">ออกจากระบบ</button></div>' +
    '<nav aria-label="เมนูแอดมิน">' + NAV.map(function (n) { return '<button data-p="' + n[0] + '">' + A.ICON[n[2]] + '<span>' + n[1] + '</span>' + (n[0] === 'req' ? '<span class="cnt" id="reqCnt" hidden></span>' : '') + '</button>'; }).join('') + '</nav>' +
    '<div class="foot"><span>เข้าสู่ระบบเป็น <b style="color:var(--gold)">' + esc(INFO.adminUser) + '</b></span><button id="lo">ออกจากระบบ</button><a href="index.html" style="color:var(--ink-muted)">หน้าพนักงาน ↗</a></div></aside>' +
    '<main class="main" id="main"></main></div>';
  root.querySelectorAll('[data-p]').forEach(function (b) { b.onclick = function () { go(b.dataset.p); }; });
  document.getElementById('lo').onclick = function () { logout(); };
  var lo2 = document.getElementById('lo2'); if (lo2) lo2.onclick = document.getElementById('lo').onclick;
}
function setCount(n) { pendingN = n; var c = document.getElementById('reqCnt'); if (c) { c.hidden = !n; c.textContent = n; } }
function go(p, keep) {
  page = p; try { history.replaceState(null, '', '#' + p); } catch (e) {}
  root.querySelectorAll('[data-p]').forEach(function (b) { if (b.dataset.p === p) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  var cur = root.querySelector('.side nav [aria-current="page"]'); if (cur && window.innerWidth <= 860) try { cur.scrollIntoView({ inline: 'center', block: 'nearest' }); } catch (e) {}
  var el = document.getElementById('main');
  if (!keep) el.innerHTML = '<div class="loading">กำลังโหลด…</div>';
  var banner = INFO.mustChange ? '<div class="warn-banner"><span>ยังใช้รหัสผ่านแอดมินเริ่มต้นอยู่ กรุณาเปลี่ยนก่อนใช้งานจริง</span><button class="btn gold sm" id="toSet">เปลี่ยนรหัสผ่าน</button></div>' : '';
  ({ today: pToday, req: pReq, cal: pCal, report: pReport, emps: pEmps, hol: pHol, set: pSet })[p](el, banner).then(function () {
    var tb = document.getElementById('toSet'); if (tb) tb.onclick = function () { go('set'); };
  }).catch(function (e) { if (keep) return; el.innerHTML = banner + '<div class="err">' + esc(e.message) + ' <button class="btn ghost sm" id="retry">ลองใหม่</button></div>'; var rb = document.getElementById('retry'); if (rb) rb.onclick = function () { go(page); }; });
  if (!keep) window.scrollTo(0, 0);
}
function head(title, sub, right) { return '<div class="page-h"><div><h1>' + title + '</h1>' + (sub ? '<p>' + sub + '</p>' : '') + '</div>' + (right || '') + '</div>'; }
function monthSel(id, cur, n) {
  var o = '', t = new Date();
  for (var i = -1; i < (n || 13); i++) { var m = A.addMonth(A.ymd(t).slice(0, 7), -i); o += '<option value="' + m + '"' + (m === cur ? ' selected' : '') + '>' + A.thMonth(m) + '</option>'; }
  return '<select id="' + id + '">' + o + '</select>';
}
function err(id, e) { var x = document.getElementById(id); if (x) x.innerHTML = '<div class="err">' + esc(e.message || e) + '</div>'; else A.toast(e.message || e); }

/* ================= ภาพรวมวันนี้ ================= */
/* ================= เซลฟี่ยืนยันตัวตน ================= */
var CAM_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
var SELFIES = {}, CAMS = {};
function getSelfie(ref) {
  if (!SELFIES[ref]) SELFIES[ref] = api('selfie', { ref: ref }).then(function (r) { return r.data || ''; }).catch(function () { return ''; });
  return SELFIES[ref];
}
function camKey(e, r) { var k = e.id + '|' + r.date; CAMS[k] = { e: e, r: r }; return k; }
function camBtn(e, r) { return r && (r.inPhoto || r.outPhoto) ? '<button class="cam-btn" data-cam="' + camKey(e, r) + '" title="ดูเซลฟี่" aria-label="ดูเซลฟี่">' + CAM_ICON + '</button>' : ''; }
function thumbs(e, r) {
  if (!r || !(r.inPhoto || r.outPhoto)) return '<span class="muted small">—</span>';
  return '<button class="sthumbs" data-cam="' + camKey(e, r) + '" title="เทียบกับรูปโปรไฟล์">' + [r.inPhoto, r.outPhoto].filter(String).map(function (ref) { return '<img data-ref="' + esc(ref) + '" alt="">'; }).join('') + '</button>';
}
function openSelfies(k) {
  var x = CAMS[k]; if (!x) return; var e = x.e, r = x.r;
  var figs = [['pf', 'รูปโปรไฟล์', e.photo ? '<img src="' + esc(e.photo) + '" alt="">' : '<div class="ph">ยังไม่มีรูปโปรไฟล์</div>']];
  if (r.inPhoto) figs.push(['fi', 'ตอนเข้างาน ' + esc(r.in), '<div class="ph">กำลังโหลด…</div>']);
  if (r.outPhoto) figs.push(['fo', 'ตอนออกงาน ' + esc(r.out), '<div class="ph">กำลังโหลด…</div>']);
  A.modal('<div class="sheet-h"><h3>' + esc(e.name) + ' · ' + A.thDate(r.date, 'year') + '</h3><button class="x" data-close aria-label="ปิด">×</button></div><div class="sheet-b stack">' +
    '<div class="selfie-pair" style="grid-template-columns:repeat(' + figs.length + ',1fr)">' + figs.map(function (f) { return '<figure id="' + f[0] + '">' + f[2] + '<figcaption>' + f[1] + '</figcaption></figure>'; }).join('') + '</div>' +
    (r.flag ? '<div class="note" style="color:var(--bad)">ตรวจสอบมือถือ: ' + esc(r.flag) + '</div>' : '') +
    '<p class="small muted">เทียบหน้าในเซลฟี่กับรูปโปรไฟล์ ถ้าไม่ใช่คนเดียวกัน แก้เวลาได้ที่รายงานรายเดือนพร้อมใส่หมายเหตุ</p></div>', 'wide');
  [['fi', r.inPhoto], ['fo', r.outPhoto]].forEach(function (p) {
    if (!p[1]) return;
    getSelfie(p[1]).then(function (url) { var f = document.querySelector('#' + p[0] + ' .ph'); if (f) f.outerHTML = url ? '<img src="' + url + '" alt="">' : '<div class="ph">รูปถูกลบแล้ว (เกินระยะเวลาเก็บ)</div>'; });
  });
}
function bindCams(root) {
  root.querySelectorAll('[data-cam]').forEach(function (b) { b.onclick = function (ev) { ev.stopPropagation(); openSelfies(b.dataset.cam); }; });
  root.querySelectorAll('.sthumbs img[data-ref]').forEach(function (img) { getSelfie(img.dataset.ref).then(function (u) { if (u) img.src = u; else img.classList.add('gone'); }); });
}

function pToday(el, banner) {
  return api('adminToday').then(function (d) {
    var rb = {}, lb = {};
    d.records.forEach(function (r) { rb[r.empId] = r; });
    d.leaves.forEach(function (l) { if (!lb[l.empId] || l.status === 'approved') lb[l.empId] = l; });
    var rows = d.employees.map(function (e) { return { e: e, r: rb[e.id], l: lb[e.id], off: !e.workToday }; });
    var offN = rows.filter(function (x) { return x.off && !x.r; }).length;
    var inN = rows.filter(function (x) { return x.r; }).length, late = rows.filter(function (x) { return x.r && x.r.lateMin > 0; }).length;
    var onLeave = rows.filter(function (x) { return !x.r && x.l && x.l.status === 'approved'; }).length;
    var pend = d.pending.leaves.length + d.pending.adjustments.length; setCount(pend);
    var status = function (x) {
      if (x.r) return (x.r.lateMin > 0 ? A.pill('late', 'สาย ' + x.r.lateMin + ' น.') : A.pill('ok', 'ตรงเวลา')) + (x.r.flag ? ' <span title="' + esc(x.r.flag) + '">' + A.pill('bad', 'ตรวจสอบมือถือ') + '</span>' : '');
      if (x.l && x.l.status === 'approved') return A.pill('leave', A.leaveLabel(x.l));
      if (d.holiday) return A.pill('holiday', 'วันหยุด');
      if (x.off) return A.pill('off', 'ไม่ใช่วันทำงาน');
      return A.pill('bad', 'ยังไม่เข้างาน');
    };
    var pl = d.pending.leaves.slice(0, 5).map(function (l) {
      return '<li><div class="grow"><b>' + esc(l.name) + '</b> · ' + esc(A.leaveLabel(l)) + '<div class="small muted num">' + A.thRange(l.start, l.end) + ' · ' + A.fmtDays(l.days) + ' วัน</div></div></li>';
    }).concat(d.pending.adjustments.slice(0, 3).map(function (a) {
      return '<li><div class="grow"><b>' + esc(a.name) + '</b> · ขอแก้เวลา<div class="small muted">' + A.thDate(a.date) + ' · ' + esc(a.in || '--:--') + ' → ' + esc(a.out || '--:--') + '</div></div></li>';
    })).join('');
    var lv = d.leaves.map(function (l) { return '<li><div class="grow"><b>' + esc(l.name) + '</b><div class="small muted">' + esc(A.leaveLabel(l)) + ' · ' + esc(l.reason) + '</div></div>' + A.reqPill(l.status) + '</li>'; }).join('');
    el.innerHTML = banner + head('ภาพรวมวันนี้', A.thDate(d.today, 'long') + (d.holiday ? ' · วันหยุด: ' + esc(d.holiday) : '') + ' · อัปเดต ' + esc(d.now) + ' น.', '<button class="btn ghost sm" id="rf">รีเฟรช</button>') +
      '<div class="kpis num"><div class="card kpi k-ok"><span>เข้างานแล้ว</span><b>' + inN + '<small class="muted" style="font-size:15px"> / ' + (rows.length - offN) + '</small></b></div>' +
      '<div class="card kpi k-late"><span>มาสายวันนี้</span><b>' + late + '</b></div><div class="card kpi k-leave"><span>ลาวันนี้</span><b>' + onLeave + '</b></div>' +
      '<div class="card kpi k-bad"><span>ยังไม่เข้างาน</span><b>' + Math.max(0, rows.length - inN - onLeave - offN) + '</b></div><div class="card kpi k-req"><span>คำขอรออนุมัติ</span><b>' + pend + '</b></div></div>' +
      '<div class="grid-2"><div class="card tbl-wrap"><table><thead><tr><th>พนักงาน</th><th>สถานะ</th><th class="r">เข้างาน</th><th class="r">ออกงาน</th><th class="r">ระยะตอนสแกน</th><th class="c">เซลฟี่</th></tr></thead><tbody>' +
      (rows.map(function (x) {
        return '<tr><td>' + A.person(x.e) + '</td><td>' + status(x) + '</td><td class="r num mono">' + (x.r ? esc(x.r.in) : '—') + '</td><td class="r num mono">' + (x.r && x.r.out ? esc(x.r.out) : '—') + '</td><td class="r num">' + (x.r && x.r.inDist !== null ? TC.util.fmtDist(x.r.inDist) : '—') + '</td><td class="c">' + thumbs(x.e, x.r) + '</td></tr>';
      }).join('') || '<tr><td colspan="6" class="empty">ยังไม่มีพนักงาน · เพิ่มได้ที่เมนูพนักงาน</td></tr>') + '</tbody></table></div>' +
      '<div class="stack"><div class="card"><div class="panel-h"><h3>รออนุมัติ</h3><button class="btn primary sm" id="toReq">พิจารณา (' + pend + ')</button></div><ul class="list">' + (pl || '<li class="empty" style="display:block">ไม่มีคำขอค้าง</li>') + '</ul></div>' +
      '<div class="card"><div class="panel-h"><h3>ลาวันนี้</h3></div><ul class="list">' + (lv || '<li class="empty" style="display:block">ไม่มีใครลา</li>') + '</ul></div></div></div>';
    bindCams(el);
    document.getElementById('rf').onclick = function () { go('today'); };
    document.getElementById('toReq').onclick = function () { go('req'); };
  });
}

/* ================= คำขออนุมัติ ================= */
function pReq(el, banner) {
  return api('requests', { filter: st.reqFilter }).then(function (d) {
    if (st.reqFilter === 'pending') setCount(d.leaves.length + d.adjustments.length);
    var items = [];
    if (st.reqKind !== 'adj') d.leaves.forEach(function (l) { items.push({ k: 'leave', x: l }); });
    if (st.reqKind !== 'leave') d.adjustments.forEach(function (a) { items.push({ k: 'adj', x: a }); });
    items.sort(function (a, b) { return String(b.x.createdAt).localeCompare(String(a.x.createdAt)); });
    var card = function (it) {
      var x = it.x, who = A.person({ name: x.name, photo: x.photo, code: x.code, position: '' }, x.code + ' · ยื่นเมื่อ ' + (x.createdAt ? A.thDate(x.createdAt.slice(0, 10), 'year') + ' ' + x.createdAt.slice(11, 16) : ''));
      var body;
      if (it.k === 'leave') {
        var q = x.quota, qtxt = '';
        if (q && q.quota !== null) { var after = q.quota - q.used - (x.status === 'pending' ? x.days : 0); qtxt = 'สิทธิ์ ' + TC.LEAVE_TYPES[x.type] + ' ใช้ไป ' + A.fmtDays(q.used) + '/' + q.quota + ' วัน' + (x.status === 'pending' ? ' · ถ้าอนุมัติเหลือ ' + A.fmtDays(after) : ''); if (x.type === 'sick' && after < 0) qtxt += ' (เกินสิทธิ์ลาป่วยที่ได้ค่าจ้าง)'; }
        body = '<div class="between"><b style="font-size:15.5px">' + esc(A.leaveLabel(x)) + ' · ' + A.fmtDays(x.days) + ' วัน</b>' + A.reqPill(x.status) + '</div>' +
          '<div class="meta"><span class="num">' + A.thRange(x.start, x.end) + '</span>' + (qtxt ? '<span>' + esc(qtxt) + '</span>' : '') + '</div>';
      } else {
        body = '<div class="between"><b style="font-size:15.5px">ขอแก้เวลา · ' + A.thDate(x.date, 'year') + '</b>' + A.reqPill(x.status) + '</div>' +
          '<div class="meta"><span>ขอเป็น <b class="mono" style="color:var(--fg)">' + esc(x.in || '--:--') + ' → ' + esc(x.out || '--:--') + '</b></span><span>บันทึกเดิม <span class="mono">' + (x.current ? esc(x.current.in || '--:--') + ' → ' + esc(x.current.out || '--:--') : 'ไม่มี') + '</span></span></div>';
      }
      var acts = x.status === 'pending'
        ? '<div class="acts"><input placeholder="หมายเหตุถึงพนักงาน (ไม่บังคับ)" data-note="' + esc(x.id) + '"><button class="btn ok sm" data-dec="approved" data-k="' + it.k + '" data-id="' + esc(x.id) + '">อนุมัติ</button><button class="btn danger sm" data-dec="rejected" data-k="' + it.k + '" data-id="' + esc(x.id) + '">ไม่อนุมัติ</button></div>'
        : (x.adminNote || x.decidedAt ? '<div class="small muted">' + (x.decidedAt ? 'พิจารณาเมื่อ ' + A.thDate(String(x.decidedAt).slice(0, 10), 'year') : '') + (x.adminNote ? ' · ' + esc(x.adminNote) : '') + '</div>' : '') +
          (it.k === 'leave' && x.status === 'approved' ? '<div class="acts"><button class="btn ghost sm" data-dec="rejected" data-k="leave" data-id="' + esc(x.id) + '">เพิกถอนการอนุมัติ</button></div>' : '');
      return '<div class="req">' + who + body + '<div class="reason">' + esc(x.reason) + '</div>' + acts + '</div>';
    };
    el.innerHTML = banner + head('คำขออนุมัติ', 'ใบลาและคำขอแก้เวลาจากพนักงาน ทุกการพิจารณาถูกบันทึกพร้อมเวลาและผู้อนุมัติ เก็บเป็นหลักฐาน',
      '<div class="hrow"><div class="seg" id="f1"><button data-v="pending" aria-pressed="' + (st.reqFilter === 'pending') + '">รออนุมัติ</button><button data-v="all" aria-pressed="' + (st.reqFilter === 'all') + '">ทั้งหมด</button></div>' +
      '<div class="seg" id="f2"><button data-v="all" aria-pressed="' + (st.reqKind === 'all') + '">ทุกประเภท</button><button data-v="leave" aria-pressed="' + (st.reqKind === 'leave') + '">ใบลา</button><button data-v="adj" aria-pressed="' + (st.reqKind === 'adj') + '">แก้เวลา</button></div></div>') +
      '<div class="card">' + (items.map(card).join('') || '<div class="empty">' + (st.reqFilter === 'pending' ? 'ไม่มีคำขอรออนุมัติ' : 'ยังไม่มีคำขอ') + '</div>') + '</div>';
    el.querySelectorAll('#f1 [data-v]').forEach(function (b) { b.onclick = function () { st.reqFilter = b.dataset.v; go('req'); }; });
    el.querySelectorAll('#f2 [data-v]').forEach(function (b) { b.onclick = function () { st.reqKind = b.dataset.v; go('req'); }; });
    el.querySelectorAll('[data-dec]').forEach(function (b) {
      b.onclick = function () {

      '<p class="small muted" style="margin-top:-6px">' + (o.startDate ? 'ตั้งไว้แล้ว' : 'ยังไม่ได้ตั้ง · ตอนนี้ใช้วันแรกที่มีคนลงเวลา: ' + (INFO.goLive ? A.thDate(INFO.goLive, 'year') : '—')) + '</p>' +
      (SUPA ? '<input type="hidden" id="sd2" value="">' : f('sd2', 'โฟลเดอร์ Google Drive สำหรับเก็บรูป (วางลิงก์โฟลเดอร์)', (INFO.admin && INFO.admin.driveFolder) || '', 'placeholder="https://drive.google.com/drive/folders/..."') +
      '<p class="small muted" style="margin-top:-6px">ระบบจะสร้างโฟลเดอร์ "รูปโปรไฟล์" และ "เซลฟี่ลงเวลา" ไว้ข้างใน · เว้นว่าง = สร้างโฟลเดอร์ใหม่ใน Drive ของเจ้าของชีต</p>') +
      '<div class="field"><label for="sx4">รูปแบบ QR Code</label><select id="sx4"><option value="static"' + (o.qrMode !== 'daily' ? ' selected' : '') + '>ถาวร · พิมพ์ติดผนังครั้งเดียว (แนะนำ)</option><option value="daily"' + (o.qrMode === 'daily' ? ' selected' : '') + '>เปลี่ยนทุกวัน · ต้องเปิดบนจอหรือพิมพ์ใหม่ทุกวัน</option></select></div>' +
      f('s9', 'URL หน้าพนักงาน (ใช้ทำ QR ให้สแกนด้วยกล้องมือถือได้เลย)', o.appUrl, 'type="url" placeholder="https://tesr-channel.github.io/Work-Tracking/"') +
      '<div id="serr"></div><button class="btn primary" type="submit">บันทึกการตั้งค่า</button></form>' +
      '<div class="stack"><div class="card pad stack"><h3 style="font-size:16px">' + (fixedQr ? 'QR Code สำหรับลงเวลา (ใช้ถาวร)' : 'QR Code ประจำวัน') + '</h3>' +
      '<p class="small muted">' + (fixedQr ? 'พิมพ์ติดผนังได้เลย ใช้ได้ตลอด ไม่ต้องเปลี่ยน · คนที่ถ่ายรูป QR กลับบ้านไปก็ลงเวลาไม่ได้ เพราะต้องอยู่ในรัศมี ' + TC.util.fmtDist(o.radius) + (o.selfie !== false ? ' และต้องถ่ายเซลฟี่' : '') : 'รหัสเปลี่ยนทุกวัน ต้องเปิดบนแท็บเล็ตหรือพิมพ์ใหม่ทุกเช้า · ต้องอยู่ในรัศมี ' + TC.util.fmtDist(o.radius)) + '</p>' +
      (o.appUrl ? '' : '<div class="note" style="color:var(--bad)">ยังไม่ได้ใส่ "URL หน้าพนักงาน" · ใส่และบันทึกก่อนพิมพ์ เพื่อให้สแกนด้วยกล้องมือถือได้ทันที</div>') +
      '<div class="qrbox"><div id="qr"></div></div><div class="small muted mono" style="text-align:center">' + (fixedQr ? 'ชุดที่ ' + esc(qr.ver) : A.thDate(qr.date, 'year')) + ' · ' + esc(qr.token) + '</div>' +
      '<div class="row"><button class="btn gold" id="prt" type="button">พิมพ์ QR ติดผนัง</button><button class="btn ghost" id="full" type="button">แสดงเต็มจอ</button></div>' +
      (fixedQr ? '<details class="small"><summary style="cursor:pointer">ใช้ QR แผ่นเดิมที่ติดผนังอยู่แล้ว (ไม่ต้องพิมพ์ใหม่)</summary><p class="muted" style="margin:8px 0">ใช้กล้องมือถือสแกน QR แผ่นเดิม แล้วคัดลอกลิงก์ที่ได้ (…?t=xxxx) มาวางที่นี่</p><div class="hrow" style="gap:8px"><input id="qfx" placeholder="https://tesr-channel.github.io/Work-Tracking/?t=…" style="flex:1"><button class="btn ghost sm" id="qfxb" type="button">ใช้รหัสนี้</button></div></details>' : '') +
      (fixedQr ? '<button class="btn ghost sm" id="rot" type="button">สร้าง QR ชุดใหม่ (QR ที่พิมพ์ไว้จะใช้ไม่ได้)</button>' : '') + '</div>' +
      '<form class="card pad stack" id="af"><h3 style="font-size:16px">บัญชีแอดมิน</h3>' + f('a1', 'อีเมล / ชื่อผู้ใช้แอดมิน', INFO.adminUser, 'autocomplete="username" autocapitalize="none" required') +
      f('a2', 'รหัสผ่านปัจจุบัน', '', 'type="password" autocomplete="current-password" required') + '<div class="row">' + f('a3', 'รหัสผ่านใหม่', '', 'type="password" autocomplete="new-password" minlength="6" required') + f('a4', 'ยืนยัน', '', 'type="password" autocomplete="new-password" minlength="6" required') + '</div>' +
      '<div id="aerr"></div><button class="btn ghost" type="submit">เปลี่ยนบัญชีแอดมิน</button></form></div></div>';
    var drawQr = function (box, size) { box.innerHTML = ''; try { new QRCode(box, { text: qr.payload, width: size, height: size, colorDark: '#0d0b0a', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M }); } catch (e) { box.textContent = 'สร้าง QR ไม่สำเร็จ'; } };
    drawQr(document.getElementById('qr'), 220);
    el.querySelectorAll('[data-goemps]').forEach(function (a) { a.onclick = function (ev) { ev.preventDefault(); go('emps'); }; });
    document.getElementById('prt').onclick = function () {
      var box = document.createElement('div'); box.id = 'printqr';
      box.innerHTML = '<div class="pq-brand"><span class="logo" role="img" aria-label="TESR"></span><div><b>' + esc(o.company) + '</b><small>' + esc(o.office) + '</small></div></div>' +
        '<h1>สแกนเพื่อลงเวลาเข้า–ออกงาน</h1><div class="pq-code" id="pqc"></div>' +
        '<ol><li>เปิดกล้องมือถือ หรือแอป TESR Time Clock แล้วสแกน</li><li>อนุญาตตำแหน่ง (GPS) · ต้องอยู่ในรัศมี ' + TC.util.fmtDist(o.radius) + '</li>' + (o.selfie !== false ? '<li>ถ่ายเซลฟี่ยืนยันตัวตน</li>' : '') + '</ol>' +
        '<small class="pq-ver">' + (fixedQr ? 'ชุดที่ ' + esc(qr.ver) : A.thDate(qr.date, 'year')) + '</small>';
      document.body.appendChild(box); drawQr(document.getElementById('pqc'), 420);
      document.body.classList.add('printing');
      var done = function () { document.body.classList.remove('printing'); box.remove(); window.removeEventListener('afterprint', done); };
      window.addEventListener('afterprint', done);
      setTimeout(function () { window.print(); setTimeout(function () { if (document.getElementById('printqr')) done(); }, 1500); }, 300);
    };
    var qfxb = document.getElementById('qfxb'); if (qfxb) qfxb.onclick = function () {
      var v = document.getElementById('qfx').value.trim(), m = v.match(/[?&]t=([A-Za-z0-9]+)/) || v.match(/\|([A-Za-z0-9]{6,40})$/) || v.match(/^([A-Za-z0-9]{6,40})$/);
      if (!m) return A.toast('ไม่พบรหัสในลิงก์ · วางลิงก์ที่ได้จากการสแกน QR เดิม');
      qfxb.disabled = true; api('saveSettings', { settings: { qrFixed: m[1] } }).then(function () { A.toast('ใช้ QR แผ่นเดิมแล้ว · ไม่ต้องพิมพ์ใหม่'); go('set'); }).catch(function (e) { qfxb.disabled = false; A.toast(e.message); });
    };
    var rot = document.getElementById('rot'); if (rot) rot.onclick = function () {
      if (!rot.dataset.armed) { rot.dataset.armed = 1; rot.textContent = 'ยืนยัน: ยกเลิก QR เดิมและสร้างชุดใหม่'; rot.className = 'btn danger sm'; return; }
      rot.disabled = true; api('rotateQr').then(function () { A.toast('สร้าง QR ชุดใหม่แล้ว · พิมพ์ติดแทนของเดิม'); go('set'); }).catch(function (e) { A.toast(e.message); rot.disabled = false; });
    };
    document.getElementById('full').onclick = function () {
      A.modal('<div class="sheet-b" style="align-items:center;text-align:center;padding:24px"><div class="login-brand" style="justify-content:center"><span class="logo" role="img" aria-label="TESR"></span><div style="text-align:left"><b>สแกนเพื่อลงเวลา</b><small>' + esc(o.office) + '</small></div></div><div class="qrbox" id="qrbig"></div><b style="font-family:var(--f-display);font-size:20px">' + (fixedQr ? 'ลงเวลาเข้า–ออกงาน' : A.thDate(qr.date, 'long')) + '</b><p class="small muted">เปิดกล้องมือถือหรือแอป TESR Time Clock แล้วสแกน</p><button class="btn ghost" data-close>ปิด</button></div>', 'wide');
      drawQr(document.getElementById('qrbig'), Math.min(420, window.innerWidth - 120));
      try { var el2 = document.querySelector('#modal .sheet'); if (el2.requestFullscreen) el2.requestFullscreen().catch(function () {}); } catch (e) {}
    };
    document.getElementById('here').onclick = function () {
      if (!navigator.geolocation) return A.toast('เครื่องนี้ไม่รองรับ GPS');
      navigator.geolocation.getCurrentPosition(function (p) { document.getElementById('s3').value = p.coords.latitude.toFixed(6); document.getElementById('s4').value = p.coords.longitude.toFixed(6); A.toast('ใส่พิกัดแล้ว กดบันทึกเพื่อใช้งาน'); }, function () { A.toast('ไม่ได้รับสิทธิ์ตำแหน่ง'); }, { enableHighAccuracy: true, timeout: 12000 });
    };
    document.getElementById('sf').onsubmit = function (ev) {
      ev.preventDefault(); var g = function (id) { return document.getElementById(id).value; };
      var s = { company: g('s1'), office: g('s2'), lat: g('s3'), lng: g('s4'), radius: g('s5'), start: g('s6'), end: g('s7'), grace: g('s8'), qPersonal: g('q1'), qSick: g('q2'), qVacation: g('q3'), qMaternity: g('q4'), appUrl: g('s9').trim(), selfie: document.getElementById('sx1').checked ? '1' : '0', deviceLock: g('sx2'), selfieDays: g('sx3'), qrMode: g('sx4'), startDate: g('sd1'), driveFolder: g('sd2').trim(),
        workdays: [].slice.call(el.querySelectorAll('.days-pick input:checked')).map(function (i) { return i.value; }).join(',') };
      api('saveSettings', { settings: s }).then(function () { A.toast('บันทึกการตั้งค่าแล้ว'); go('set'); }).catch(function (e) { err('serr', e); });
    };
    document.getElementById('af').onsubmit = function (ev) {
      ev.preventDefault(); var g = function (id) { return document.getElementById(id).value; };
      if (g('a3') !== g('a4')) return err('aerr', 'รหัสผ่านใหม่ทั้งสองช่องไม่ตรงกัน');
      api('changeAdmin', { username: g('a1'), old: g('a2'), password: g('a3') }).then(function (r) { A.store.set(TOKEN, r.token); A.toast('เปลี่ยนบัญชีแอดมินแล้ว'); start(); }).catch(function (e) { err('aerr', e); });
    };
  });
}

start();
})();
</script>
</body>
</html>
