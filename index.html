<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0b0a">
<title>TESR Time Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: brand strip on top with a mode switch; employee side is a phone-width column, admin side is a tabbed console. TESR CI: black / crimson / gold */
:root{
  --bg:#f6f4f1; --surface:#ffffff; --surface-2:#efebe6; --line:#ddd6cf;
  --fg:#17130f; --muted:#6b625a;
  --crimson:#8B0000; --crimson-soft:#f5e3e1; --gold:#C9A84C; --gold-ink:#7a6220;
  --ok:#1f7a4a; --ok-soft:#dff1e7; --warn:#a2560b; --warn-soft:#fbead6; --bad:#b3261e; --bad-soft:#fbe1df;
  --ink:#0d0b0a; --on-ink:#f3eee6;
  --f-display:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f0d0c; --surface:#1a1716; --surface-2:#24201e; --line:#3a3330;
  --fg:#f1ebe4; --muted:#a69c93; --crimson:#d2453c; --crimson-soft:#3a1715; --gold:#d8b964; --gold-ink:#e6cc85;
  --ok:#5fcf93; --ok-soft:#173326; --warn:#f0a65a; --warn-soft:#3a2714; --bad:#ff7b72; --bad-soft:#3d1a18;
  --ink:#000; --on-ink:#f3eee6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f0d0c; --surface:#1a1716; --surface-2:#24201e; --line:#3a3330;
  --fg:#f1ebe4; --muted:#a69c93; --crimson:#d2453c; --crimson-soft:#3a1715; --gold:#d8b964; --gold-ink:#e6cc85;
  --ok:#5fcf93; --ok-soft:#173326; --warn:#f0a65a; --warn-soft:#3a2714; --bad:#ff7b72; --bad-soft:#3d1a18;
  --ink:#000; --on-ink:#f3eee6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:var(--on-ink);border-bottom:3px solid var(--crimson)}
.topbar-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.mark{width:34px;height:34px;border:2px solid var(--gold);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:var(--gold);font-size:13px;letter-spacing:.04em}
.brand b{font-family:var(--f-display);font-size:17px;letter-spacing:.02em}
.brand small{display:block;color:#b8ad9f;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
.seg{display:flex;background:#221c19;border:1px solid #3d3330;border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:#cfc4b6;padding:6px 14px;border-radius:999px;font-size:13.5px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--gold);color:#17130f}

.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
.demo-note{font-size:12.5px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line);padding:8px 12px;border-radius:8px;margin-bottom:16px}

/* ---------- employee ---------- */
.phone{max-width:430px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.who{display:flex;align-items:center;gap:12px}
.who select{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);background:var(--surface);border-radius:8px}
.hero{background:var(--ink);color:var(--on-ink);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border:1px solid rgba(201,168,76,.25);border-radius:50%}
.hero-top{display:flex;gap:14px;align-items:center}
.avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;background:var(--crimson);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;flex:none;border:2px solid var(--gold);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.sm{width:36px;height:36px;font-size:13px;border-width:1.5px}
.hero h2{font-size:20px}
.hero .role{color:#b8ad9f;font-size:13px}
.clock{font-family:var(--f-display);font-size:44px;font-weight:600;letter-spacing:.02em;line-height:1}
.clock-date{color:#cfc4b6;font-size:13px}
.shift{font-size:12.5px;color:#b8ad9f;font-family:var(--f-mono)}
.punch{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.punch .cell{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.punch .lbl{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.punch .t{font-family:var(--f-display);font-size:26px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.late{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.idle{background:var(--surface-2);color:var(--muted)}
.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--crimson);color:#fff}
.btn.gold{background:var(--gold);color:#17130f}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;border-radius:8px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-scan{width:100%;font-size:17px;padding:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.sec-h h3{font-size:16px}
.sec-h span{font-size:12.5px;color:var(--muted)}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.hist li:first-child{border-top:0}
.hist .d{font-family:var(--f-display);font-weight:600;font-size:14px}
.hist .d small{display:block;font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:11.5px}
.hist .tt{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.sum-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sum-strip div{background:var(--surface);padding:10px 12px}
.sum-strip b{display:block;font-family:var(--f-display);font-size:22px}
.sum-strip span{font-size:12px;color:var(--muted)}

/* scanner modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,8,7,.72);display:grid;place-items:center;padding:16px}
.sheet{width:100%;max-width:430px;background:var(--surface);border-radius:16px;overflow:hidden;max-height:92vh;overflow-y:auto}
.viewfinder{background:#050404;aspect-ratio:1/1;max-width:100%;position:relative;display:grid;place-items:center}
.viewfinder .frame{width:62%;aspect-ratio:1/1;position:relative}
.viewfinder .frame i{position:absolute;width:28px;height:28px;border-color:var(--gold);border-style:solid}
.viewfinder .frame i:nth-child(1){top:0;left:0;border-width:3px 0 0 3px}
.viewfinder .frame i:nth-child(2){top:0;right:0;border-width:3px 3px 0 0}
.viewfinder .frame i:nth-child(3){bottom:0;left:0;border-width:0 0 3px 3px}
.viewfinder .frame i:nth-child(4){bottom:0;right:0;border-width:0 3px 3px 0}
.viewfinder .laser{position:absolute;left:6%;right:6%;height:2px;background:#e04a3f;box-shadow:0 0 12px #e04a3f;top:10%;animation:scan 2.2s ease-in-out infinite alternate}
@keyframes scan{to{top:88%}}
@media (prefers-reduced-motion:reduce){.viewfinder .laser{animation:none;top:50%}}
.viewfinder .vf-cap{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#d8cfc4;font-size:13px}
.sheet-body{padding:16px;display:flex;flex-direction:column;gap:12px}
.geo{display:flex;gap:12px;align-items:center;padding:12px;border-radius:10px;border:1px solid var(--line)}
.geo.in{background:var(--ok-soft);border-color:transparent}
.geo.out{background:var(--bad-soft);border-color:transparent}
.geo b{font-family:var(--f-display)}
.geo .dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--muted)}
.geo.in .dot{background:var(--ok)} .geo.out .dot{background:var(--bad)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12.5px;color:var(--muted)}
.field input,.field select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}
.result{padding:16px;border-radius:12px;text-align:center}
.result h3{font-size:22px}
.result.ok{background:var(--ok-soft);color:var(--ok)}
.result.bad{background:var(--bad-soft);color:var(--bad)}
.result.late{background:var(--warn-soft);color:var(--warn)}

/* ---------- admin ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;font-family:var(--f-display);font-size:15px}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--crimson)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi{padding:14px}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi b{display:block;font-family:var(--f-display);font-size:30px;line-height:1.1}
.kpi.k-late b{color:var(--warn)} .kpi.k-abs b{color:var(--bad)} .kpi.k-in b{color:var(--ok)}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.person{display:flex;align-items:center;gap:10px;min-width:160px}
.person small{display:block;color:var(--muted);font-size:12px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
.toolbar .field{flex:0 1 200px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.panel{padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h3{font-size:17px}
.qrbox{display:grid;place-items:center;background:#fff;padding:18px;border-radius:12px;border:1px solid var(--line)}
.qrbox canvas,.qrbox img{max-width:100%;height:auto}
.qrmeta{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);word-break:break-all;text-align:center}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--warn)}
textarea{width:100%;min-height:140px;font-family:var(--f-mono);font-size:12px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--fg)}
.confirm{display:flex;gap:6px;align-items:center;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;border-left:3px solid var(--gold);max-width:calc(100% - 32px)}
.empty{padding:20px;text-align:center;color:var(--muted)}
</style>

<style>[hidden]{display:none!important}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<style>
.viewfinder video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.viewfinder .frame{z-index:1}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:12px;align-items:center;padding:12px;border-radius:10px;border:1px solid var(--line)}
.step .dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--muted)}
.step.ok{background:var(--ok-soft);border-color:transparent}.step.ok .dot{background:var(--ok)}
.step.bad{background:var(--bad-soft);border-color:transparent}.step.bad .dot{background:var(--bad)}
.step b{font-family:var(--f-display)}
.step small{color:var(--muted)}
.mode-badge{font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid #5a4b45;color:#d8cfc4}
.mode-badge.live{border-color:var(--gold);color:var(--gold)}
.login{max-width:360px;margin:40px auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{display:flex;align-items:center;gap:4px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;cursor:pointer}
.days input{accent-color:var(--crimson)}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--surface-2)}
tr.sel td{background:var(--crimson-soft)}
.detail-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 10px}

</style>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand"><div class="mark">TESR</div><div><b>Time Clock</b><small>ลงเวลาเข้า–ออกงาน</small></div></div>
    <span class="mode-badge" id="modeBadge">Demo</span>
    <div class="seg" role="group" aria-label="โหมด">
      <button id="m-emp" aria-pressed="true">พนักงาน</button>
      <button id="m-adm" aria-pressed="false">แอดมิน</button>
    </div>
  </div>
</header>

<main class="wrap">
  <p class="demo-note" id="demoNote" hidden>โหมดทดลอง · ข้อมูลเป็นตัวอย่างและเก็บในเบราว์เซอร์นี้เท่านั้น · ใส่ URL ของ Apps Script ใน <code>API_URL</code> เพื่อบันทึกลง Google Sheet จริง · <button class="btn ghost sm" id="reset" style="padding:2px 8px">รีเซ็ตข้อมูลตัวอย่าง</button></p>
  <section id="view-emp"><div class="loading">กำลังโหลด…</div></section>
  <section id="view-adm" hidden></section>
</main>

<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
/* ================= CONFIG =================
   วาง URL ของ Apps Script Web App (ลงท้ายด้วย /exec) ไว้ตรงนี้
   ปล่อยว่าง = โหมดทดลอง ใช้ข้อมูลตัวอย่างในเบราว์เซอร์ */
const API_URL = '';
/* ========================================== */

(function(){
const REMOTE=!!API_URL;
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const toMin=s=>{if(!s)return null;const[a,b]=s.split(':').map(Number);return a*60+b};
const TH_M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_MF=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TH_D=['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
const TH_DF=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>'e'+Math.random().toString(36).slice(2,10);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const sess={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}};
function haversine(a,b,c,d){const R=6371000,t=x=>x*Math.PI/180;const dl=t(c-a),dg=t(d-b);const h=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const fmtDist=m=>m>=1000?(m/1000).toFixed(2)+' กม.':Math.round(m)+' ม.';
const fmtLate=m=>{if(!m)return '0 นาที';const h=Math.floor(m/60);return h?`${h} ชม. ${m%60} นาที`:`${m} นาที`};
const thDate=s=>{const d=new Date(s+'T00:00');return `${TH_D[d.getDay()]} ${d.getDate()} ${TH_M[d.getMonth()]}`};
const lateOf=(t,s)=>t?Math.max(0,toMin(t)-toMin(s.start)-(+s.grace||0)):0;
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2800)}
function parseToken(txt){txt=String(txt||'').trim();try{const u=new URL(txt);const t=u.searchParams.get('t');if(t)return t}catch(e){}const p=txt.split('|');return p.length>=3?p[2]:txt}

/* ================= DATA LAYER =================
   Remote = Apps Script + Google Sheet · Local = ข้อมูลตัวอย่างในเบราว์เซอร์ (logic เดียวกับฝั่ง server) */
let PIN=sess.get('tesr-tc-pin')||'';
async function call(action,params){
  let r;
  try{r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action},params||{}))})}
  catch(e){throw new Error('เชื่อมต่อ Google Sheet ไม่ได้ ตรวจสอบอินเทอร์เน็ตหรือ URL ของ Apps Script')}
  const j=await r.json().catch(()=>({ok:false,error:'Apps Script ตอบกลับไม่ถูกต้อง (ตรวจสิทธิ์ Deploy เป็น Anyone)'}));
  if(!j.ok)throw new Error(j.error||'เกิดข้อผิดพลาด');return j.data;
}
const Remote={
  init:()=>call('init'), my:(empId,month)=>call('my',{empId,month}),
  punch:p=>call('punch',p), photo:(empId,data)=>call('photo',{empId,data}),
  login:pin=>call('login',{pin}), today:()=>call('today',{pin:PIN}), month:m=>call('month',{pin:PIN,month:m}),
  saveEmp:emp=>call('saveEmp',{pin:PIN,emp}), delEmp:id=>call('delEmp',{pin:PIN,id}),
  saveSettings:s=>call('saveSettings',{pin:PIN,settings:s}), qr:()=>call('qr',{pin:PIN}), buildMonth:m=>call('buildMonth',{pin:PIN,month:m})
};

const KEY='tesr-timeclock-v2';
function seed(){
  const settings={office:'TESR HQ · นนทบุรี',lat:13.8621,lng:100.5144,radius:1000,start:'08:30',end:'17:30',grace:0,workdays:[1,2,3,4,5],appUrl:''};
  const emps=[['TESR-001','สมชาย ใจดี','Robotics Engineer'],['TESR-002','กมลวรรณ ศรีสุข','Academy Coordinator'],['TESR-003','ธนพล วงศ์ทอง','Embedded Developer'],['TESR-004','ปิยะนุช แก้วมณี','Shop & Logistics'],['TESR-005','วีระพงษ์ บุญมา','AI / Vision Engineer']]
    .map((x,i)=>({id:'e'+(i+1),code:x[0],name:x[1],pos:x[2],photo:'',active:true}));
  let s=7;const rnd=()=>{s=(s*9301+49297)%233280;return s/233280};
  const recs=[],today=new Date(),T=ymd(today);
  for(let d=new Date(today.getFullYear(),today.getMonth()-1,1);ymd(d)<=T;d.setDate(d.getDate()+1)){
    if(d.getDay()===0||d.getDay()===6)continue;const k=ymd(d),isT=k===T;
    emps.forEach((e,i)=>{
      if(!isT&&rnd()<0.05)return; if(isT&&i===4)return;
      let m=8*60+30-Math.floor(rnd()*25); if(rnd()<(i===3?.45:i===0?.25:.12))m=8*60+31+Math.floor(rnd()*40);
      const o=isT?null:17*60+30+Math.floor(rnd()*50), tin=pad(m/60|0)+':'+pad(m%60);
      recs.push({date:k,empId:e.id,in:tin,out:o==null?'':pad(o/60|0)+':'+pad(o%60),late:lateOf(tin,settings),inDist:Math.round(40+rnd()*300),outDist:o==null?null:Math.round(40+rnd()*300)});
    });
  }
  return {settings,employees:emps,records:recs,holidays:[{date:ymd(new Date(today.getFullYear(),today.getMonth(),13)),name:'วันหยุดตัวอย่าง'}]};
}
let DB=(()=>{try{const v=store.get(KEY);if(v)return JSON.parse(v)}catch(e){}return seed()})();

function localToken(date){let h=7;for(const c of 'TESR|'+date)h=(h*31+c.charCodeAt(0))>>>0;return h.toString(36).toUpperCase()}
const pubEmp=e=>({id:e.id,code:e.code,name:e.name,pos:e.pos,photo:e.photo});
function localWorkdays(m){const[y,mo]=m.split('-').map(Number),T=ymd(new Date()),hol=DB.holidays.map(h=>h.date),out=[];
  for(let d=new Date(y,mo-1,1);d.getMonth()===mo-1;d.setDate(d.getDate()+1)){const k=ymd(d);if(k>T)break;if(DB.settings.workdays.includes(d.getDay())&&!hol.includes(k))out.push(k)}return out}
const wait=v=>new Promise(r=>setTimeout(()=>r(JSON.parse(JSON.stringify(v))),120));
const Local={
  init:()=>wait({settings:DB.settings,employees:DB.employees.filter(e=>e.active).map(pubEmp),today:ymd(new Date())}),
  my:(id,m)=>wait(DB.records.filter(r=>r.empId===id&&r.date.startsWith(m))),
  async punch(p){
    const s=DB.settings,date=ymd(new Date()),time=p.time||hm(new Date());
    if(p.token!==localToken(date))throw new Error('QR Code ไม่ถูกต้องหรือหมดอายุ (ใช้ได้เฉพาะ QR ของวันนี้)');
    const dist=Math.round(haversine(p.lat,p.lng,s.lat,s.lng));
    if(dist>s.radius)throw new Error(`อยู่ห่างออฟฟิศ ${fmtDist(dist)} เกินรัศมีที่อนุญาต ${fmtDist(s.radius)}`);
    let r=DB.records.find(x=>x.empId===p.empId&&x.date===date);
    if(r){if(r.out)throw new Error('วันนี้ลงเวลาเข้า–ออกครบแล้ว');r.out=time;r.outDist=dist;saveDB();return wait({kind:'out',rec:r})}
    r={date,empId:p.empId,in:time,out:'',late:lateOf(time,s),inDist:dist,outDist:null};DB.records.push(r);saveDB();return wait({kind:'in',rec:r});
  },
  async photo(id,data){const e=DB.employees.find(x=>x.id===id);e.photo=data;saveDB();return wait({url:data})},
  login:()=>wait(true),
  today:()=>{const d=ymd(new Date());return wait({employees:DB.employees.filter(e=>e.active).map(pubEmp),records:DB.records.filter(r=>r.date===d),today:d})},
  month:m=>{const recs=DB.records.filter(r=>r.date.startsWith(m)),ids=new Set(recs.map(r=>r.empId));
    return wait({employees:DB.employees.filter(e=>e.active||ids.has(e.id)).map(pubEmp),records:recs,workdays:localWorkdays(m),holidays:DB.holidays.filter(h=>h.date.startsWith(m)),today:ymd(new Date())})},
  async saveEmp(e){if(e.id){Object.assign(DB.employees.find(x=>x.id===e.id),{code:e.code,name:e.name,pos:e.pos})}else{if(DB.employees.some(x=>x.active&&x.code===e.code))throw new Error('รหัสพนักงาน '+e.code+' มีอยู่แล้ว');e={...e,id:uid(),photo:'',active:true};DB.employees.push(e)}saveDB();return wait({id:e.id})},
  async delEmp(id){DB.employees.find(x=>x.id===id).active=false;saveDB();return wait(true)},
  async saveSettings(s){delete s.adminPin;if(typeof s.workdays==='string')s.workdays=s.workdays.split(',').filter(Boolean).map(Number);Object.assign(DB.settings,s);saveDB();return wait(DB.settings)},
  qr:()=>{const d=ymd(new Date()),t=localToken(d),u=DB.settings.appUrl;return wait({date:d,token:t,payload:u?u.replace(/[?#].*$/,'')+'?t='+t:`TESR-ATTEND|${d}|${t}`})},
  buildMonth:()=>wait({url:''})
};

function readPhoto(file,cb){if(!file)return;const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),z=320;c.width=c.height=z;const k=Math.min(img.width,img.height);c.getContext('2d').drawImage(img,(img.width-k)/2,(img.height-k)/2,k,k,0,0,z,z);cb(c.toDataURL('image/jpeg',.82))};img.src=fr.result};fr.readAsDataURL(file)}

/* ---------- punch sheet: 1) QR  2) GPS  3) ยืนยัน ---------- */
const modal=document.getElementById('modal');
function openPunch(kind,presetToken){
  let token=presetToken||'',pos=null,stopCam=null,src='sim-in';
  const S=APP.settings;
  modal.hidden=false;
  modal.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="ลงเวลา">
    <div class="viewfinder" id="vf"><video id="vid" muted playsinline hidden></video><div class="frame"><i></i><i></i><i></i><i></i><div class="laser"></div></div><div class="vf-cap" id="vfcap">เล็ง QR Code ที่ติดหน้าออฟฟิศ</div></div>
    <div class="sheet-body">
      <div class="steps"><div class="step" id="st-qr"><span class="dot"></span><div id="st-qr-t">รอสแกน QR Code</div></div>
      <div class="step" id="st-geo"><span class="dot"></span><div id="st-geo-t">กำลังหาตำแหน่ง…</div></div></div>
      ${REMOTE?'':`<details open><summary style="cursor:pointer;font-size:13px;color:var(--muted)">โหมดทดลอง</summary>
        <div class="row" style="margin-top:10px">
          <div class="field"><label for="src">ตำแหน่งมือถือ</label><select id="src"><option value="sim-in">จำลอง: อยู่ในออฟฟิศ (~180 ม.)</option><option value="sim-out">จำลอง: นอกพื้นที่ (~3.4 กม.)</option><option value="gps">GPS จริงของเครื่อง</option></select></div>
          <div class="field"><label for="tm">เวลาที่สแกน</label><input id="tm" type="time" value="${hm(new Date())}"></div></div>
        <button class="btn ghost sm" id="fakeqr" style="margin-top:10px">จำลองการสแกน QR</button></details>`}
      <div id="res"></div>
      <div class="row"><button class="btn ghost" id="cl">ยกเลิก</button><button class="btn ${kind==='in'?'primary':'gold'}" id="go" disabled>ยืนยัน${kind==='in'?'เช็คอิน':'เช็คเอาท์'}</button></div>
    </div></div>`;
  const $=id=>document.getElementById(id);
  function setStep(id,cls,html){$(id).className='step '+(cls||'');$(id+'-t').innerHTML=html}
  function ready(){$('go').disabled=!(token&&pos&&pos.dist<=S.radius)}
  function gotToken(t){token=parseToken(t);if(stopCam){stopCam();stopCam=null}$('vid').hidden=true;setStep('st-qr','ok','<b>อ่าน QR แล้ว</b>');$('vfcap').textContent='อ่าน QR สำเร็จ';ready()}
  function showPos(){const d=haversine(pos.lat,pos.lng,S.lat,S.lng);pos.dist=d;const ok=d<=S.radius;
    setStep('st-geo',ok?'ok':'bad',`<b>${ok?'อยู่ในพื้นที่':'อยู่นอกพื้นที่'}</b> · ห่างออฟฟิศ <span class="num">${fmtDist(d)}</span><br><small>อนุญาตไม่เกิน ${fmtDist(S.radius)} · ${pos.label}</small>`);ready()}
  function gps(){
    pos=null;setStep('st-geo','','กำลังขอตำแหน่ง GPS…');ready();
    if(!navigator.geolocation){setStep('st-geo','bad','<b>เครื่องนี้ไม่รองรับ GPS</b>');return}
    navigator.geolocation.getCurrentPosition(p=>{pos={lat:p.coords.latitude,lng:p.coords.longitude,label:`GPS ±${Math.round(p.coords.accuracy)} ม.`};showPos()},
      ()=>setStep('st-geo','bad','<b>ไม่ได้รับสิทธิ์ตำแหน่ง</b><br><small>เปิด Location ให้เบราว์เซอร์แล้วลองใหม่</small>'),{enableHighAccuracy:true,timeout:10000,maximumAge:0});
  }
  function locate(){if(src==='sim-in'){pos={lat:S.lat+.0012,lng:S.lng+.0011,label:'ตำแหน่งจำลอง'};showPos()}else if(src==='sim-out'){pos={lat:S.lat+.025,lng:S.lng+.022,label:'ตำแหน่งจำลอง'};showPos()}else gps()}
  async function camera(){
    if(!navigator.mediaDevices?.getUserMedia||!window.jsQR){$('vfcap').textContent='เปิดกล้องไม่ได้ · สแกน QR ด้วยกล้องมือถือแทนได้';return}
    try{
      const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
      const v=$('vid');v.srcObject=stream;v.hidden=false;await v.play();
      const c=document.createElement('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});let stop=false;
      stopCam=()=>{stop=true;stream.getTracks().forEach(t=>t.stop())};
      (function tick(){if(stop)return;if(v.readyState>=2&&v.videoWidth){const k=Math.min(1,640/v.videoWidth);c.width=v.videoWidth*k|0;c.height=v.videoHeight*k|0;ctx.drawImage(v,0,0,c.width,c.height);
        const q=jsQR(ctx.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:'dontInvert'});if(q&&q.data){gotToken(q.data);return}}requestAnimationFrame(tick)})();
    }catch(e){$('vfcap').textContent=REMOTE?'ไม่ได้รับสิทธิ์กล้อง · อนุญาตกล้องแล้วลองใหม่':'กล้องใช้ไม่ได้ในหน้านี้ · กด "จำลองการสแกน QR"'}
  }
  if(token)gotToken(token);else camera();
  if(REMOTE)gps();else{locate();$('src').onchange=ev=>{src=ev.target.value;locate()};$('fakeqr').onclick=()=>gotToken(`TESR-ATTEND|${ymd(new Date())}|${localToken(ymd(new Date()))}`)}
  function close(){if(stopCam)stopCam();modal.hidden=true;modal.innerHTML='';renderEmp()}
  $('cl').onclick=close;
  $('go').onclick=async()=>{
    const go=$('go');go.disabled=true;go.textContent='กำลังบันทึก…';
    try{
      const res=await API.punch({empId:me,token,lat:pos.lat,lng:pos.lng,time:REMOTE?undefined:$('tm').value});
      const r=res.rec;
      $('res').innerHTML=res.kind==='in'
        ?`<div class="result ${r.late?'late':'ok'}"><h3 class="num">เช็คอิน ${r.in}</h3>${r.late?`มาสาย ${fmtLate(r.late)}`:'ตรงเวลา ขอให้เป็นวันที่ดี'}</div>`
        :`<div class="result ok"><h3 class="num">เช็คเอาท์ ${r.out}</h3>บันทึกเวลาออกงานแล้ว</div>`;
      go.textContent='เสร็จสิ้น';go.disabled=false;go.onclick=close;
    }catch(err){$('res').innerHTML=`<div class="result bad"><h3>ลงเวลาไม่สำเร็จ</h3>${esc(err.message)}</div>`;go.textContent='ลองอีกครั้ง';ready()}
  };
}

  const inN=rows.filter(x=>x.r).length,lateN=rows.filter(x=>x.r&&x.r.late>0).length,outN=rows.filter(x=>x.r?.out).length;

function calcMonth(d){
  return d.employees.map(e=>{
    const rs=d.records.filter(r=>r.empId===e.id),by={};rs.forEach(r=>by[r.date]=r);
    const dates=[...new Set([...d.workdays,...rs.map(r=>r.date)])].sort();
    const days=dates.map(k=>{const r=by[k],off=!d.workdays.includes(k);
      return {date:k,r,off,st:r?(r.late>0?'late':'ok'):(k===d.today?'pending':'absent')}});
    const mins=rs.filter(r=>r.out).reduce((s,r)=>s+toMin(r.out)-toMin(r.in),0);
    return {e,days,present:rs.length,lateDays:rs.filter(r=>r.late>0).length,lateMin:rs.reduce((s,r)=>s+(+r.late||0),0),
      absent:days.filter(x=>x.st==='absent').length,noOut:rs.filter(r=>!r.out&&r.date<d.today).length,hours:mins/60,work:d.workdays.filter(k=>k<d.today||by[k]).length};
  });
}
const ST={ok:['ok','มา'],late:['late','สาย'],absent:['bad','ขาด'],pending:['idle','ยังไม่เข้างาน']};
async function admReport(el){
  const d=await API.month(repMonth),rows=calcMonth(d),max=Math.max(1,...rows.map(r=>r.lateMin));
  const [y,mo]=repMonth.split('-').map(Number),now=new Date();
  const months=[];for(let i=0;i<12;i++){const t=new Date(now.getFullYear(),now.getMonth()-i,1);months.push(ymd(t).slice(0,7))}
  if(!rows.some(r=>r.e.id===selEmp))selEmp=rows[0]?.e.id;
  const sel=rows.find(r=>r.e.id===selEmp);
  el.innerHTML=`<div class="toolbar">
    <div class="field"><label for="rm">เดือน</label><select id="rm">${months.map(m=>{const[a,b]=m.split('-').map(Number);return `<option value="${m}"${m===repMonth?' selected':''}>${TH_MF[b-1]} ${a+543}</option>`}).join('')}</select></div>

    ${rows.map(r=>`<tr class="clickable${r.e.id===selEmp?' sel':''}" data-emp="${r.e.id}"><td><div class="person">${avatar(r.e,1)}<div>${esc(r.e.name)}<small>${esc(r.e.code)}</small></div></div></td>
      <td class="r num">${r.work}</td><td class="r num">${r.present}</td><td class="r num" style="color:${r.absent?'var(--bad)':'inherit'}">${r.absent}</td><td class="r num">${r.lateDays}</td>
      <td><div style="display:flex;align-items:center;gap:10px"><span class="num" style="min-width:64px;font-weight:600;color:${r.lateMin?'var(--warn)':'var(--muted)'}">${r.lateMin} นาที</span><div class="bar" style="flex:1"><i style="width:${r.lateMin/max*100}%"></i></div></div></td>
      <td class="r num">${r.noOut}</td><td class="r num">${r.hours.toFixed(1)}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">ไม่มีข้อมูล</td></tr>'}
    </tbody></table></div>
    ${sel?`<div class="detail-h"><h3 style="font-size:17px">รายวัน · ${esc(sel.e.name)}</h3><span style="color:var(--muted);font-size:13px">แตะชื่อในตารางด้านบนเพื่อดูคนอื่น</span></div>
    <div class="card tbl-wrap"><table><thead><tr><th>วันที่</th><th>สถานะ</th><th class="r">เข้างาน</th><th class="r">ออกงาน</th><th class="r">สาย (นาที)</th></tr></thead><tbody>
    ${sel.days.map(x=>{const[c,t]=ST[x.st];return `<tr><td class="num">${thDate(x.date)}${x.off?' <small style="color:var(--muted)">(วันหยุด)</small>':''}</td><td><span class="pill ${c}">${t}</span></td>
      <td class="r num">${x.r?.in||'—'}</td><td class="r num">${x.r?(x.r.out||(x.date<d.today?'<span style="color:var(--bad)">ไม่ได้เช็คเอาท์</span>':'—')):'—'}</td><td class="r num">${x.r?x.r.late:'—'}</td></tr>`}).join('')||'<tr><td colspan="5" class="empty">ยังไม่มีวันทำงานในเดือนนี้</td></tr>'}
    </tbody></table></div>`:''}
    <div id="xout"></div>
    <p style="font-size:12.5px;color:var(--muted)">นับสายเมื่อเช็คอินหลัง ${esc(APP.settings.start)}${+APP.settings.grace?` (ผ่อนผัน ${APP.settings.grace} นาที)`:''} · นับวันขาดเฉพาะวันทำงานที่ผ่านมาแล้ว ไม่รวมวันหยุด${d.holidays.length?' ('+d.holidays.map(h=>esc(h.name)+' '+thDate(h.date)).join(', ')+')':''} · ${TH_MF[mo-1]} ${y+543}</p>`;
  document.getElementById('rm').onchange=ev=>{repMonth=ev.target.value;renderAdm()};
  el.querySelectorAll('[data-emp]').forEach(tr=>tr.onclick=()=>{selEmp=tr.dataset.emp;admReport(el)});
  const bs=document.getElementById('bs');if(bs)bs.onclick=async()=>{bs.disabled=true;bs.textContent='กำลังสร้างชีต…';
    try{const r=await API.buildMonth(repMonth);document.getElementById('bsout').innerHTML=`<p>อัปเดตชีต "สรุป ${repMonth}" แล้ว · <a class="link" href="${esc(r.url)}" target="_blank" rel="noopener">เปิด Google Sheet ↗</a></p>`}
    catch(e){document.getElementById('bsout').innerHTML=errBox(e.message)}bs.disabled=false;bs.textContent='อัปเดตชีตสรุปใน Google Sheets'};
  const q=v=>`"${String(v).replace(/"/g,'""')}"`;
  const exportCsv=(name,lines)=>{
    const csv='﻿'+lines.map(l=>l.map(q).join(',')).join('\r\n');
    try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){}
    document.getElementById('xout').innerHTML=`<div class="card panel" style="margin-top:14px"><div class="sec-h"><h3>${esc(name)}</h3><button class="btn sm ghost" id="cp">คัดลอก</button></div><textarea id="csvt" readonly>${esc(csv.slice(1))}</textarea><small style="color:var(--muted)">ถ้าไฟล์ไม่ดาวน์โหลดเอง คัดลอกไปวางใน Excel / Google Sheets ได้</small></div>`;
    document.getElementById('cp').onclick=()=>{const t=document.getElementById('csvt');(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>toast('คัดลอกแล้ว'),()=>{t.select();toast('เลือกข้อความแล้ว กด Ctrl+C')})};
  };
  document.getElementById('xs').onclick=()=>exportCsv(`TESR-attendance-summary-${repMonth}.csv`,[['รหัส','ชื่อ','ตำแหน่ง','วันทำงาน','มา(วัน)','ขาด(วัน)','มาสาย(วัน)','สายรวม(นาที)','ลืมเช็คเอาท์','ชั่วโมงทำงาน']].concat(rows.map(r=>[r.e.code,r.e.name,r.e.pos,r.work,r.present,r.absent,r.lateDays,r.lateMin,r.noOut,r.hours.toFixed(1)])));
  document.getElementById('xd').onclick=()=>exportCsv(`TESR-attendance-daily-${repMonth}.csv`,[['วันที่','รหัส','ชื่อ','สถานะ','เข้างาน','ออกงาน','สาย(นาที)']].concat(rows.flatMap(r=>r.days.map(x=>[x.date,r.e.code,r.e.name,ST[x.st][1]+(x.off?' (วันหยุด)':''),x.r?.in||'',x.r?.out||'',x.r?x.r.late:'']))));
}
