<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0b0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TESR ลงเวลา">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<title>TESR Time Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div id="app"><div class="loading">กำลังโหลด…</div></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="assets/config.js"></script>
<script src="assets/core.js"></script>
<script src="assets/mock.js"></script>
<script src="assets/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
(function () {
var A = APP, esc = A.esc, TOKEN = 'tesr-tc-emp';
var api = A.makeApi(TOKEN, function () { logout('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่'); });
var root = document.getElementById('app');
var ME = null, view = 'home', MONTHS = {}, calMonth = null, selDay = null, REQS = null;
var urlToken = '';
try { var q = new URLSearchParams(location.search); urlToken = q.get('t') || ''; if (urlToken) history.replaceState(null, '', location.pathname); } catch (e) {}

/* ================= login / register ================= */
function showLogin(msg) {
  root.innerHTML = '<div class="login-wrap"><form class="login-card" id="lf">' +
    '<div class="login-brand"><span class="logo lg" role="img" aria-label="TESR"></span><div><b>Time Clock</b><small>Thai Embedded System and Robotics · ลงเวลาเข้า–ออกงาน</small></div></div>' +
    '<div class="field"><label for="u">อีเมล</label><input id="u" type="email" autocomplete="username" autocapitalize="none" inputmode="email" required></div>' +
    '<div class="field"><label for="p">รหัสผ่าน</label><input id="p" type="password" autocomplete="current-password" required></div>' +
    '<p class="small muted">ครั้งแรกใช้รหัสผ่านเป็นเบอร์โทรศัพท์ที่ให้ไว้กับบริษัท (เช่น 0891234567) เปลี่ยนเองได้ที่หน้าโปรไฟล์</p>' +
    '<div id="lerr"></div><button class="btn primary block" type="submit">เข้าสู่ระบบ</button>' +
    (A.REMOTE ? '' : '<div class="demo-hint">โหมดทดลอง · <code>somchai@example.com</code> / <code>0800000001</code></div>') +
    '</form></div>';
  if (msg) document.getElementById('lerr').innerHTML = '<div class="err">' + esc(msg) + '</div>';
  var f = document.getElementById('lf');
  f.onsubmit = function (ev) {
    ev.preventDefault();
    var btn = f.querySelector('button[type=submit]'); btn.disabled = true;
    api('login', { as: 'emp', username: document.getElementById('u').value, password: document.getElementById('p').value })
      .then(function (r) { A.store.set(TOKEN, r.token); start(); })
      .catch(function (e) { document.getElementById('lerr').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; btn.disabled = false; });
  };
}
function logout(msg) { A.store.set(TOKEN, null); A.cacheClear(); ME = null; MONTHS = {}; REQS = null; showLogin(msg); }

/* ================= shell ================= */
function start() {
  if (!A.store.get(TOKEN)) return showLogin();
  root.innerHTML = '<div class="loading">กำลังโหลด…</div>';
  api('me').then(function (d) {
    ME = d; calMonth = calMonth || d.today.slice(0, 7);
    shell(); go(view);
    if (urlToken) { var t = urlToken; urlToken = ''; var r = ME.rec; if (!r || !r.out) openPunch(r ? 'out' : 'in', t); }
  }).catch(function (e) { if (e.code !== 'AUTH') showLogin(e.message); });
}
function shell() {
  var tabs = [['home', 'หน้าแรก', 'home'], ['cal', 'ปฏิทิน', 'cal'], ['leave', 'การลา', 'leave'], ['me', 'โปรไฟล์', 'user']];
  root.innerHTML = '<header class="emp-top"><div class="emp-top-in"><span class="logo" role="img" aria-label="TESR"></span><b>Time Clock</b><span class="small" style="margin-left:auto;color:var(--ink-muted)">' + esc(ME.settings.company) + '</span></div></header>' +
    '<main class="emp-main" id="view"></main>' +
    '<nav class="tabbar" aria-label="เมนู"><div class="tabbar-in">' + tabs.map(function (t) {
      return '<button data-go="' + t[0] + '">' + A.ICON[t[2]] + t[1] + (t[0] === 'leave' && ME.pending ? '<span class="badge">' + ME.pending + '</span>' : '') + '</button>';
    }).join('') + '</div></nav>';
  root.querySelectorAll('[data-go]').forEach(function (b) { b.onclick = function () { go(b.dataset.go); }; });
}
A.onFresh(function (action, d) {
  if (!ME || !document.getElementById('view') || !A.idle()) return;
  if (action === 'me') { ME = d; shell(); }
  MONTHS = {}; REQS = null; go(view, true);
});
function go(v, keep) {
  view = v;
  root.querySelectorAll('[data-go]').forEach(function (b) { if (b.dataset.go === v) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  var el = document.getElementById('view');
  ({ home: vHome, cal: vCal, leave: vLeave, me: vMe })[v](el);
  if (!keep) window.scrollTo(0, 0);
}
function month(m, force) {
  if (MONTHS[m] && !force) return Promise.resolve(MONTHS[m]);
  return api('myMonth', { month: m }).then(function (d) { MONTHS[m] = d; return d; });
}
function refresh() { MONTHS = {}; REQS = null; return api('me').then(function (d) { ME = d; shell(); go(view); }); }
setInterval(function () { var c = document.getElementById('clock'); if (c) c.textContent = A.hm(new Date()); }, 10000);

/* ================= home ================= */
function vHome(el) {
  var e = ME.emp, S = ME.settings, r = ME.rec, now = new Date();
  var next = !r ? 'in' : (!r.out ? 'out' : 'done');
  el.innerHTML = '<section class="hero"><div class="who"><span class="avatar lg" style="width:58px;height:58px;font-size:20px">' + (e.photo ? '<img src="' + esc(e.photo) + '" alt="" referrerpolicy="no-referrer">' : esc(e.name.slice(0, 1))) + '</span>' +
    '<div style="min-width:0"><h2>' + esc(e.name) + '</h2><div class="role">' + esc(e.position || '') + ' · ' + esc(e.code) + '</div></div></div>' +
    '<div><div class="clock num" id="clock">' + A.hm(now) + '</div><div class="clock-date">' + A.thDate(ME.today, 'long') + '</div></div>' +
    '<div class="shift">' + (ME.workToday ? 'วันนี้เข้างาน ' + esc(ME.shiftToday.start) + '–' + esc(ME.shiftToday.end) : 'วันนี้เป็นวันหยุดของคุณ') + ' · ' + esc(ME.schedule) + '</div></section>' +
    '<div id="todaynote"></div>' +
    '<div class="punch"><div class="card cell"><div class="lbl">เข้างาน</div><div class="t num">' + (r && r.in || '--:--') + '</div>' +
    (r ? (r.lateMin ? A.pill('late', 'สาย ' + A.fmtLate(r.lateMin)) : A.pill('ok', 'ตรงเวลา')) : A.pill('idle', 'ยังไม่เช็คอิน')) + '</div>' +
    '<div class="card cell"><div class="lbl">ออกงาน</div><div class="t num">' + (r && r.out || '--:--') + '</div>' +
    (r && r.out ? A.pill('ok', 'ลงเวลาแล้ว') : A.pill('idle', 'ยังไม่เช็คเอาท์')) + '</div></div>' +
    (next === 'done' ? '<button class="btn ghost btn-scan" disabled>วันนี้ลงเวลาครบแล้ว</button>'
      : '<button class="btn ' + (next === 'in' ? 'primary' : 'gold') + ' btn-scan" id="scan">สแกน QR ' + (next === 'in' ? 'เช็คอินเข้างาน' : 'เช็คเอาท์ออกงาน') + '</button>') +
    '<section class="stack"><div class="sec-h"><h3>เดือน' + A.TH_MF[now.getMonth()] + '</h3><button class="btn ghost sm" data-go2="cal">ดูปฏิทิน</button></div>' +
    '<div class="sum-strip num" id="msum"><div><b>–</b><span>มาทำงาน</span></div><div><b>–</b><span>มาสาย</span></div><div><b>–</b><span>สายรวม (นาที)</span></div><div><b>–</b><span>ลา (วัน)</span></div></div>' +
    '<div class="card"><ul class="list" id="recent"><li class="empty" style="display:block">กำลังโหลด…</li></ul></div></section>';
  var sb = document.getElementById('scan'); if (sb) sb.onclick = function () { openPunch(next); };
  el.querySelector('[data-go2]').onclick = function () { go('cal'); };
  month(ME.today.slice(0, 7)).then(function (d) {
    var t = d.report.t, today = d.report.days.filter(function (x) { return x.date === ME.today; })[0];
    document.getElementById('msum').innerHTML = '<div><b>' + t.present + '</b><span>มาทำงาน</span></div><div><b style="color:var(--warn)">' + t.lateDays + '</b><span>มาสาย (ครั้ง)</span></div>' +
      '<div><b>' + t.lateMin + '</b><span>สายรวม (นาที)</span></div><div><b style="color:var(--leave)">' + A.fmtDays(t.leaveDays) + '</b><span>ลา (วัน)</span></div>';
    if (today && (today.holiday || today.leave)) {
      document.getElementById('todaynote').innerHTML = '<div class="note">' + (today.holiday ? 'วันนี้เป็นวันหยุด: ' + esc(today.holiday) : 'วันนี้มีใบลา: ' + esc(A.leaveLabel(today.leave)) + ' (' + A.REQ[today.leave.status][1] + ')') + '</div>';
    }
    var past = d.report.days.filter(function (x) { return x.date <= ME.today && x.st !== 'pre' && (x.work || x.rec || x.leave); }).reverse().slice(0, 7);
    document.getElementById('recent').innerHTML = past.length ? past.map(dayRow).join('') : '<li class="empty" style="display:block">ยังไม่มีข้อมูลเดือนนี้</li>';
  }).catch(function (e) { A.toast(e.message); });
}
function dayRow(x) {
  var r = x.rec, d = new Date(x.date + 'T00:00');
  var tag = x.leave && x.st !== 'leave' ? ' ' + A.pill(x.leave.status === 'approved' ? 'leave' : 'pending', A.leaveLabel(x.leave)) : '';
  return '<li><div style="width:64px" class="num"><b style="font-family:var(--f-display)">' + d.getDate() + ' ' + A.TH_M[d.getMonth()] + '</b><div class="small muted">' + A.TH_D[d.getDay()] + '</div></div>' +
    '<div class="grow mono small muted">' + (r ? esc(r.in) + ' → ' + esc(r.out || '--:--') : (x.st === 'leave' ? esc(A.leaveLabel(x.leave)) : '—')) + '</div>' +
    '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px">' + (x.st === 'late' ? A.pill('late', 'สาย ' + x.late + ' น.') : A.stPill(x.st)) +
    (x.early ? A.pill('late', 'ออกก่อน ' + x.early + ' น.') : '') + (x.flags && x.flags.indexOf('noOut') >= 0 ? A.pill('bad', 'ลืมเช็คเอาท์') : '') + tag + '</div></li>';
}

/* ================= calendar ================= */
function vCal(el) {
  el.innerHTML = '<div class="card pad stack"><div class="cal-nav">' + A.monthPicker('emp', calMonth) + '</div>' +
    '<div class="cal" id="cal"><div class="loading" style="grid-column:1/-1">กำลังโหลด…</div></div>' +
    '<div class="legend"><span><i class="dot ok"></i>มา</span><span><i class="dot late"></i>สาย</span><span><i class="dot absent"></i>ขาด</span><span><i class="dot leave"></i>ลา</span><span><i class="dot req"></i>ลารออนุมัติ</span><span><i class="dot holiday"></i>วันหยุด</span></div></div>' +
    '<div class="card" id="dd"></div><div id="adjs"></div>';
  A.bindMonthPicker('emp', calMonth, function (m) { calMonth = m; selDay = null; vCal(el); });
  month(calMonth).then(function (d) {
    var by = {}; d.report.days.forEach(function (x) { by[x.date] = x; });
    if (!selDay || !by[selDay]) selDay = by[ME.today] ? ME.today : d.report.days[0].date;
    var draw = function () {
      document.getElementById('cal').innerHTML = A.calendar(calMonth, function (ds) {
        var x = by[ds], dots = '';
        if (x.st === 'ok' || x.st === 'late' || x.st === 'absent' || x.st === 'leave') dots += '<i class="dot ' + x.st + '"></i>';
        if (x.leave && x.st !== 'leave') dots += '<i class="dot ' + (x.leave.status === 'approved' ? 'leave' : 'req') + '"></i>';
        if (x.holiday) dots += '<i class="dot holiday"></i>';
        return { html: '<button class="d' + (ds === ME.today ? ' today' : '') + (ds === selDay ? ' sel' : '') + (!x.work ? ' offday' : '') + '" data-d="' + ds + '"><span class="n">' + (+ds.slice(8)) + '</span><span class="dots">' + dots + '</span></button>' };
      });
      document.querySelectorAll('#cal [data-d]').forEach(function (b) { b.onclick = function () { selDay = b.dataset.d; draw(); }; });
      dayDetail(by[selDay], d);
    };
    draw();
    var adj = d.adjustments || [];
    document.getElementById('adjs').innerHTML = adj.length ? '<div class="card"><div class="panel-h"><h3>คำขอแก้เวลาเดือนนี้</h3></div><ul class="list">' + adj.map(function (a) {
      return '<li><div class="grow"><b>' + A.thDate(a.date) + '</b> <span class="mono small muted">' + esc(a.in || '--:--') + ' → ' + esc(a.out || '--:--') + '</span><div class="small muted">' + esc(a.reason) + (a.adminNote ? ' · แอดมิน: ' + esc(a.adminNote) : '') + '</div></div>' + A.reqPill(a.status) + '</li>';
    }).join('') + '</ul></div>' : '';
  }).catch(function (e) { A.toast(e.message); });
}
function dayDetail(x, d) {
  var el = document.getElementById('dd'), r = x.rec, l = x.leave;
  var canAdj = x.date <= ME.today && (x.work || r);
  var canLeave = x.date >= ME.today && x.work && !(l && (l.status === 'approved' || l.status === 'pending'));
  el.innerHTML = '<div class="day-detail"><div class="between"><h3 style="font-size:17px">' + A.thDate(x.date, 'long') + '</h3>' + (x.st === 'future' ? '' : A.stPill(x.st)) + '</div>' +
    '<dl class="kv">' +
    (x.holiday ? '<dt>วันหยุด</dt><dd>' + esc(x.holiday) + '</dd>' : '') +
    (x.shift ? '<dt>เวลางาน</dt><dd class="mono">' + esc(x.shift.start) + '–' + esc(x.shift.end) + '</dd>' : '') +
    (r ? '<dt>เข้างาน</dt><dd class="mono">' + esc(r.in) + (x.late ? ' <span class="pill late">สาย ' + A.fmtLate(x.late) + '</span>' : '') + '</dd><dt>ออกงาน</dt><dd class="mono">' + esc(r.out || (x.date < ME.today ? 'ไม่ได้เช็คเอาท์' : '--:--')) + (x.early ? ' <span class="pill late">ออกก่อน ' + A.fmtLate(x.early) + '</span>' : '') + '</dd>' + (r.note ? '<dt>หมายเหตุ</dt><dd>' + esc(r.note) + '</dd>' : '') : '') +
    (l ? '<dt>การลา</dt><dd>' + esc(A.leaveLabel(l)) + ' ' + A.reqPill(l.status) + '<div class="small muted">' + esc(l.reason) + '</div></dd>' : '') +
    (!r && !l && !x.holiday && x.work && x.date < ME.today ? '<dt>สถานะ</dt><dd>ไม่มีบันทึกเวลา</dd>' : '') +
    '</dl><div class="row">' +
    (canAdj ? '<button class="btn ghost sm" id="adjBtn">ขอแก้เวลาวันนี้</button>' : '') +
    (canLeave ? '<button class="btn primary sm" id="lvBtn">ยื่นลาวันนี้</button>' : '') + '</div></div>';
  var ab = document.getElementById('adjBtn'); if (ab) ab.onclick = function () { openAdj(x.date, r); };
  var lb = document.getElementById('lvBtn'); if (lb) lb.onclick = function () { openLeave(x.date); };
}

/* ================= leave ================= */
function vLeave(el) {
  el.innerHTML = '<div class="row"><button class="btn primary" id="newL">ยื่นใบลา</button><button class="btn ghost" id="newA">ขอแก้เวลา</button></div><div id="lv"><div class="loading">กำลังโหลด…</div></div>';
  document.getElementById('newL').onclick = function () { openLeave(); };
  document.getElementById('newA').onclick = function () { openAdj(ME.today, ME.rec); };
  api('myRequests').then(function (d) {
    REQS = d;
    var U = d.usage, types = ['personal', 'sick', 'vacation', 'maternity'].filter(function (t) { return t !== 'maternity' || U[t].quota > 0; });
    var cards = types.map(function (t) {
      var u = U[t], left = Math.max(0, u.quota - u.used), pct = u.quota ? Math.min(100, u.used / u.quota * 100) : 0;
      return '<div class="card q"><div class="small muted">' + esc(u.label) + '</div><b class="num">' + A.fmtDays(left) + '</b> <span class="small muted">/ ' + u.quota + ' วัน</span>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div><div class="small muted" style="margin-top:4px">ใช้ ' + A.fmtDays(u.used) + (u.pending ? ' · รอ ' + A.fmtDays(u.pending) : '') + '</div></div>';
    }).join('');
    var leaves = d.leaves.map(function (l) {
      var canCancel = l.status === 'pending' || (l.status === 'approved' && l.start > ME.today);
      return '<li style="align-items:flex-start"><div class="grow stack" style="gap:3px"><div class="between"><b>' + esc(A.leaveLabel(l)) + '</b>' + A.reqPill(l.status) + '</div>' +
        '<div class="small num">' + A.thRange(l.start, l.end) + ' · ' + A.fmtDays(l.days) + ' วัน</div><div class="small muted">' + esc(l.reason) + '</div>' +
        (l.adminNote ? '<div class="small" style="color:var(--gold-ink)">แอดมิน: ' + esc(l.adminNote) + '</div>' : '') +
        (canCancel ? '<div><button class="btn ghost sm" data-cancel="' + esc(l.id) + '">ยกเลิกใบลา</button></div>' : '') + '</div></li>';
    }).join('');
    var adjs = d.adjustments.slice(0, 10).map(function (a) {
      return '<li><div class="grow"><b>' + A.thDate(a.date, 'year') + '</b> <span class="mono small muted">' + esc(a.in || '--:--') + ' → ' + esc(a.out || '--:--') + '</span><div class="small muted">' + esc(a.reason) + (a.adminNote ? ' · แอดมิน: ' + esc(a.adminNote) : '') + '</div></div>' + A.reqPill(a.status) + '</li>';
    }).join('');
    document.getElementById('lv').innerHTML = '<section class="stack"><div class="sec-h"><h3>สิทธิ์การลาปี ' + (+ME.today.slice(0, 4) + 543) + '</h3><span class="small muted">คงเหลือ</span></div><div class="quota">' + cards + '</div></section>' +
      '<section class="stack"><h3 style="font-size:16px">ประวัติใบลา</h3><div class="card"><ul class="list">' + (leaves || '<li class="empty" style="display:block">ยังไม่มีใบลา</li>') + '</ul></div></section>' +
      (adjs ? '<section class="stack"><h3 style="font-size:16px">คำขอแก้เวลา</h3><div class="card"><ul class="list">' + adjs + '</ul></div></section>' : '');
    document.querySelectorAll('[data-cancel]').forEach(function (b) {
      b.onclick = function () {
        if (b.dataset.armed) {
          b.disabled = true;
          api('leaveCancel', { id: b.dataset.cancel }).then(function () { A.toast('ยกเลิกใบลาแล้ว'); refresh(); }).catch(function (e) { A.toast(e.message); b.disabled = false; });
        } else { b.dataset.armed = '1'; b.textContent = 'กดอีกครั้งเพื่อยืนยันการยกเลิก'; b.className = 'btn danger sm'; }
      };
    });
  }).catch(function (e) { document.getElementById('lv').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
}
function workdaysBetween(a, b, part) {
  var wd = TC.util.daysOf(ME.emp, ME.settings);
  if (part !== 'full') return wd.indexOf(TC.util.dow(a)) >= 0 ? 0.5 : 0;
  return TC.util.range(a, b).filter(function (d) { return wd.indexOf(TC.util.dow(d)) >= 0; }).length;
}
function openLeave(date) {
  var U = (REQS && REQS.usage) || ME.usage, part = 'full';
  var types = Object.keys(TC.LEAVE_TYPES).filter(function (t) { return t !== 'maternity' || (U[t] && U[t].quota > 0); });
  date = date || ME.today;
  A.modal('<div class="sheet-h"><h3>ยื่นใบลา</h3><button class="x" data-close aria-label="ปิด">×</button></div><form class="sheet-b" id="lf2">' +
    '<div class="field"><label for="lt">ประเภทการลา</label><select id="lt">' + types.map(function (t) {
      var u = U[t]; return '<option value="' + t + '">' + TC.LEAVE_TYPES[t] + (u && u.quota !== null ? ' (เหลือ ' + A.fmtDays(Math.max(0, u.quota - u.used - u.pending)) + ' วัน)' : '') + '</option>';
    }).join('') + '</select></div>' +
    '<div class="field"><span class="lbl">ช่วงเวลา</span><div class="seg" id="pt"><button type="button" data-p="full" aria-pressed="true">เต็มวัน</button><button type="button" data-p="am" aria-pressed="false">ครึ่งวันเช้า</button><button type="button" data-p="pm" aria-pressed="false">ครึ่งวันบ่าย</button></div></div>' +
    '<div class="row"><div class="field"><label for="ls">ตั้งแต่วันที่</label><input id="ls" type="date" value="' + date + '" required></div>' +
    '<div class="field" id="leW"><label for="le">ถึงวันที่</label><input id="le" type="date" value="' + date + '" required></div></div>' +

/* รหัสประจำเครื่อง: สุ่มครั้งแรกแล้วเก็บไว้ในเบราว์เซอร์นี้ ใช้ผูก 1 บัญชี = 1 มือถือ */
function deviceId() {
  var k = 'tesr-tc-dev', v = A.store.get(k);
  if (!v) { var m = document.cookie.match(/(?:^|; )tesrdev=([A-Za-z0-9-]+)/); v = m && m[1]; }
  if (!v || v.length < 12) {
    var a = new Uint8Array(12); (window.crypto || window.msCrypto).getRandomValues(a);
    v = 'D' + Array.prototype.map.call(a, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
  }
  A.store.set(k, v); try { document.cookie = 'tesrdev=' + v + '; max-age=' + 60 * 60 * 24 * 400 + '; path=/; SameSite=Lax; Secure'; } catch (e) {}
  return v;
}

/* ================= punch: 1) QR 2) GPS 3) เซลฟี่ 4) บันทึกอัตโนมัติ ================= */
function openPunch(kind, presetToken) {
  var token = presetToken || '', pos = null, stopCam = null, src = 'sim-in', S = ME.settings, sent = false, needSelfie = S.selfie !== false, selfie = '', selfieOn = false;
  A.sound.unlock();
  var m = A.modal('<div class="viewfinder"><video id="vid" muted playsinline hidden></video><div class="frame" id="qframe"><i></i><i></i><i></i><i></i><div class="laser"></div></div><div class="oval" id="oval" hidden></div><div class="cap" id="vcap">เล็ง QR Code ที่ติดหน้าออฟฟิศ</div><button class="shutter" id="shot" hidden aria-label="ถ่ายเซลฟี่"></button><div class="vf-done" id="vdone" hidden></div></div>' +
    '<div class="sheet-b" style="padding-top:14px"><div class="steps"><div class="step" id="sq"><span class="sd"></span><div id="sq-t">รอสแกน QR Code</div></div><div class="step" id="sg"><span class="sd"></span><div id="sg-t">กำลังหาตำแหน่ง…</div></div>' +
    (needSelfie ? '<div class="step" id="ss"><span class="sd"></span><div id="ss-t">ถ่ายเซลฟี่ยืนยันตัวตน</div></div>' : '') + '</div>' +
    (A.REMOTE ? '' : '<details open><summary class="small muted" style="cursor:pointer">โหมดทดลอง</summary><div class="row" style="margin-top:8px"><div class="field"><label for="src">ตำแหน่งมือถือ</label><select id="src"><option value="sim-in">จำลอง: อยู่ในออฟฟิศ</option><option value="sim-out">จำลอง: นอกพื้นที่ ~3 กม.</option><option value="gps">GPS จริงของเครื่อง</option></select></div></div><div class="hrow" style="gap:8px;margin-top:8px;flex-wrap:wrap"><button class="btn ghost sm" id="fake">จำลองการสแกน QR</button>' + (needSelfie ? '<button class="btn ghost sm" id="fakeself">จำลองเซลฟี่</button>' : '') + '</div></details>') +
    '<div id="res"></div><div class="row"><button class="btn ghost" id="cl">ยกเลิก</button><button class="btn ' + (kind === 'in' ? 'primary' : 'gold') + '" id="go" disabled>ยืนยัน' + (kind === 'in' ? 'เช็คอิน' : 'เช็คเอาท์') + '</button></div></div>');
  var $ = function (id) { return document.getElementById(id); };
  var step = function (id, cls, html) { if (!$(id)) return; $(id).className = 'step ' + (cls || ''); $(id + '-t').innerHTML = html; };
  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var CROSS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  var WAIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="9" opacity=".25"/><path d="M12 3a9 9 0 019 9"><animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="0.9s" repeatCount="indefinite"/></path></svg>';
  var vf = function (cls, icon, title, sub) { var d = $('vdone'); if (!d) return; d.hidden = false; d.className = 'vf-done ' + cls; d.innerHTML = '<div class="ic">' + icon + '</div><b>' + title + '</b>' + (sub ? '<span>' + sub + '</span>' : ''); };
  var vfHide = function () { var d = $('vdone'); if (d) d.hidden = true; };
  var inArea = function () { return !!(pos && pos.dist <= S.radius); };
  var ready = function () {
    var ok = !!(token && inArea() && (!needSelfie || selfie));
    $('go').disabled = !ok;
    if (ok && !sent) return submit();
    if (sent || !token) return;
    if (!pos) vf('ok', CHECK, 'สแกน QR สำเร็จ', 'กำลังตรวจตำแหน่ง…');
    else if (!inArea()) { if (!pos.warned) { pos.warned = true; A.sound.bad(); vf('bad', CROSS, 'อยู่นอกพื้นที่', 'ห่างออฟฟิศ ' + TC.util.fmtDist(pos.dist) + ' · ลงเวลาไม่ได้'); } }
    else if (needSelfie && !selfie && !selfieOn) startSelfie();
  };
  var parse = function (t) { t = String(t || '').trim(); try { var u = new URL(t), v = u.searchParams.get('t'); if (v) return v; } catch (e) {} var p = t.split('|'); return p.length >= 3 ? p[2] : t; };
  var stopVideo = function () { if (stopCam) { stopCam(); stopCam = null; } var v = $('vid'); if (v) { v.hidden = true; v.classList.remove('mirror'); } };
  var got = function (t) { token = parse(t); stopVideo(); $('qframe').hidden = true; A.sound.scan(); vf('ok', CHECK, 'สแกน QR สำเร็จ', pos ? '' : 'กำลังตรวจตำแหน่ง…'); step('sq', 'ok', '<b>อ่าน QR แล้ว</b>'); $('vcap').textContent = ''; ready(); };
  var show = function () {
    var d = TC.util.haversine(pos.lat, pos.lng, S.lat, S.lng), ok = d <= S.radius; pos.dist = d;
    step('sg', ok ? 'ok' : 'bad', '<b>' + (ok ? 'อยู่ในพื้นที่' : 'อยู่นอกพื้นที่') + '</b> · ห่างออฟฟิศ <span class="num">' + TC.util.fmtDist(d) + '</span><br><small>อนุญาตไม่เกิน ' + TC.util.fmtDist(S.radius) + ' · ' + pos.label + '</small>'); ready();
  };
  var gps = function () {
    pos = null; step('sg', '', 'กำลังขอตำแหน่ง GPS…'); ready();
    if (!navigator.geolocation) return step('sg', 'bad', '<b>เครื่องนี้ไม่รองรับ GPS</b>');
    navigator.geolocation.getCurrentPosition(function (p) { pos = { lat: p.coords.latitude, lng: p.coords.longitude, label: 'GPS ±' + Math.round(p.coords.accuracy) + ' ม.' }; show(); },
      function () { step('sg', 'bad', '<b>ไม่ได้รับสิทธิ์ตำแหน่ง</b><br><small>เปิด Location ให้เบราว์เซอร์ แล้วลองใหม่</small>'); if (token) { A.sound.bad(); vf('bad', CROSS, 'ไม่ได้รับตำแหน่ง GPS', 'เปิด Location แล้วลองใหม่'); } }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 });
  };
  var locate = function () {
    if (src === 'sim-in') { pos = { lat: S.lat + 0.0012, lng: S.lng + 0.001, label: 'ตำแหน่งจำลอง' }; show(); }
    else if (src === 'sim-out') { pos = { lat: S.lat + 0.022, lng: S.lng + 0.02, label: 'ตำแหน่งจำลอง' }; show(); }
    else gps();
  };
  var openCam = function (facing, onStream, onFail) {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return onFail();
    navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 960 } }, audio: false }).then(function (stream) {
      var v = $('vid'); if (!v) { stream.getTracks().forEach(function (t) { t.stop(); }); return; }
      v.srcObject = stream; v.hidden = false; v.play();
      stopCam = function () { stream.getTracks().forEach(function (t) { t.stop(); }); };
      onStream(v);
    }).catch(onFail);
  };
  var camera = function () {
    if (!window.jsQR) { $('vcap').textContent = 'เปิดกล้องไม่ได้ · สแกน QR ด้วยกล้องมือถือแทนได้'; return; }
    openCam('environment', function (v) {
      var c = document.createElement('canvas'), ctx = c.getContext('2d', { willReadFrequently: true }), mine = stopCam;
      (function tick() {
        if (stopCam !== mine || token) return;
        if (v.readyState >= 2 && v.videoWidth) {
          var k = Math.min(1, 640 / v.videoWidth); c.width = v.videoWidth * k | 0; c.height = v.videoHeight * k | 0;
          ctx.drawImage(v, 0, 0, c.width, c.height);
          var q = jsQR(ctx.getImageData(0, 0, c.width, c.height).data, c.width, c.height, { inversionAttempts: 'dontInvert' });
          if (q && q.data) return got(q.data);
        }
        requestAnimationFrame(tick);
      })();
    }, function () { $('vcap').textContent = A.REMOTE ? 'ไม่ได้รับสิทธิ์กล้อง · อนุญาตกล้องแล้วลองใหม่' : 'กล้องใช้ไม่ได้ในหน้านี้ · กด "จำลองการสแกน QR"'; });
  };
  /* เซลฟี่: ใช้กล้องหน้าถ่ายสดเท่านั้น (เลือกรูปจากอัลบั้มไม่ได้) */
  var tookSelfie = function (url) {
    selfie = url; selfieOn = false; stopVideo();
    $('shot').hidden = true; $('oval').hidden = true; $('vcap').textContent = '';
    A.sound.scan(); step('ss', 'ok', '<b>ถ่ายเซลฟี่แล้ว</b>'); vf('ok', '<img class="selfie-thumb" src="' + url + '" alt="">', 'ถ่ายรูปแล้ว', 'กำลังบันทึกเวลา…'); ready();
  };
  var startSelfie = function () {
    selfieOn = true; stopVideo(); vfHide();
    step('ss', '', '<b>ถ่ายเซลฟี่</b> · หันหน้าเข้ากล้องให้เห็นหน้าชัด แล้วกดปุ่มถ่าย');
    $('vcap').textContent = 'ให้ใบหน้าอยู่ในกรอบ แล้วกดปุ่มถ่าย';
    openCam('user', function (v) {
      v.classList.add('mirror'); $('oval').hidden = false; $('shot').hidden = false;
      $('shot').onclick = function () {
        if (!v.videoWidth) return;
        var w = 360, h = Math.round(w * v.videoHeight / v.videoWidth), c = document.createElement('canvas'); c.width = w; c.height = h;
        var ctx = c.getContext('2d'); ctx.translate(w, 0); ctx.scale(-1, 1); ctx.drawImage(v, 0, 0, w, h);
        tookSelfie(c.toDataURL('image/jpeg', 0.72));
      };
    }, function () {
      selfieOn = false; A.sound.bad();
      vf('bad', CROSS, 'เปิดกล้องหน้าไม่ได้', A.REMOTE ? 'อนุญาตให้เบราว์เซอร์ใช้กล้อง แล้วแตะที่นี่เพื่อลองใหม่' : 'โหมดทดลอง: กด "จำลองเซลฟี่"');
      if (A.REMOTE) $('vdone').onclick = function () { $('vdone').onclick = null; startSelfie(); };
      step('ss', 'bad', '<b>ยังไม่ได้ถ่ายเซลฟี่</b>');
    });
  };
  m._onclose = function () { stopVideo(); };
  if (token) got(token); else camera();
  if (A.REMOTE) gps(); else {
    locate(); $('src').onchange = function (ev) { src = ev.target.value; locate(); };
    $('fake').onclick = function () { got('TESR-ATTEND|x|' + TCMock.qrToken()); };
    if ($('fakeself')) $('fakeself').onclick = function () {
      if (!token || !inArea()) return A.toast('สแกน QR และอยู่ในพื้นที่ก่อน');
      var c = document.createElement('canvas'); c.width = 240; c.height = 320; var x = c.getContext('2d');
      x.fillStyle = '#c9b48a'; x.fillRect(0, 0, 240, 320); x.fillStyle = '#7a5a3a'; x.beginPath(); x.arc(120, 130, 60, 0, 7); x.fill(); x.fillRect(50, 210, 140, 110);
      x.fillStyle = '#fff'; x.font = '16px sans-serif'; x.fillText(new Date().toLocaleTimeString('th-TH'), 70, 300);
      tookSelfie(c.toDataURL('image/jpeg', 0.72));
    };
  }
  $('cl').onclick = A.closeModal;
  function submit() {
    var go = $('go'); sent = true; go.disabled = true; go.textContent = 'กำลังบันทึก…';
    vf('wait', WAIT, 'กำลังบันทึกเวลา…', '');
    api('punch', { token2: token, lat: pos.lat, lng: pos.lng, selfie: selfie, dev: deviceId() }).then(function (res) {
      var r = res.rec, late = res.kind === 'in' && r.lateMin, pic = selfie ? '<img class="selfie-thumb" src="' + selfie + '" alt="">' : CHECK;
      if (late) A.sound.warn(); else A.sound.ok();
      vf(late ? 'warn' : 'ok', pic, (res.kind === 'in' ? 'เช็คอิน ' + esc(r.in) : 'เช็คเอาท์ ' + esc(r.out)) + ' น.', res.kind === 'in' ? (late ? 'มาสาย ' + A.fmtLate(r.lateMin) : 'ตรงเวลา ขอให้เป็นวันที่ดี') : 'บันทึกเวลาออกงานแล้ว');
      $('res').innerHTML = (res.kind === 'in'
        ? '<div class="result ' + (late ? 'late' : 'ok') + '"><h3 class="num">เช็คอินสำเร็จ ' + esc(r.in) + '</h3>' + (late ? 'มาสาย ' + A.fmtLate(r.lateMin) : 'ตรงเวลา ขอให้เป็นวันที่ดี') + '</div>'
        : '<div class="result ok"><h3 class="num">เช็คเอาท์สำเร็จ ' + esc(r.out) + '</h3>บันทึกเวลาออกงานแล้ว</div>') +
        (res.flag ? '<p class="small" style="color:var(--warn);margin-top:8px">ระบบแจ้งแอดมินแล้ว: ' + esc(res.flag) + '</p>' : '');
      go.textContent = 'เสร็จสิ้น'; go.disabled = false; go.onclick = function () { A.closeModal(); refresh(); };
    }).catch(function (e) {
      A.sound.bad(); vf('bad', CROSS, 'ลงเวลาไม่สำเร็จ', esc(e.message));
      $('res').innerHTML = '<div class="result bad"><h3>ลงเวลาไม่สำเร็จ</h3>' + esc(e.message) + '</div>';
      go.textContent = 'ลองอีกครั้ง'; go.disabled = !(token && inArea());
      go.onclick = function () { A.sound.unlock(); if (e.code === 'SELFIE') { sent = false; selfie = ''; startSelfie(); } else submit(); };
    });
  }
  $('go').onclick = function () { A.sound.unlock(); submit(); };
}

start();
})();
</script>
</body>
</html>
